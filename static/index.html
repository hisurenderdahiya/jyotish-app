<title>Jyotish – Kundali</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#3B3FA8"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
[data-theme=din]{--bg:#F2F4FA;--card:#fff;--ink:#1B1F3B;--mut:#5B6180;--acc:#3B3FA8;--onacc:#fff;--line:#D5DAEB}
[data-theme=raat]{--bg:#0E1125;--card:#171B38;--ink:#ECEEFB;--mut:#9CA2CC;--acc:#F2B84B;--onacc:#1A1500;--line:#2B3062}
[data-theme=sagar]{--bg:#E6F3F4;--card:#fff;--ink:#0B2F36;--mut:#4F7077;--acc:#0E7C86;--onacc:#fff;--line:#C4E0E3}
[data-theme=van]{--bg:#E9F2E4;--card:#fff;--ink:#1A2E1C;--mut:#56705A;--acc:#2E7D32;--onacc:#fff;--line:#CBDFC4}
[data-theme=sandhya]{--bg:#1C1030;--card:#291944;--ink:#F1E9FF;--mut:#B7A6D9;--acc:#FF8A5B;--onacc:#2A0E00;--line:#413066}
[data-theme=amoled]{--bg:#000;--card:#0D0D0D;--ink:#EEE;--mut:#999;--acc:#5BC0FF;--onacc:#001522;--line:#2A2A2A}
[data-theme=kesar]{--bg:#FAE3C0;--card:#FFF6E6;--ink:#3A1620;--mut:#7B5560;--acc:#A3191B;--onacc:#fff;--line:#E6C99B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Nirmala UI","Segoe UI",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:24px;margin:0;flex:1;font-weight:600}
h2{font-size:19px;margin:18px 0 8px;font-weight:600}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
input,select{width:100%}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}nav button{flex:1 1 auto}nav button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{font-size:13px;color:var(--mut);display:block}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.step{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:0 0 16px}.step h3{margin:0 0 2px;font-size:17px}
.ex{background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:14px}
.mut{color:var(--mut);font-size:13px}.err{color:#d33}
svg{width:100%;height:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
</style></head>

[`${i.h+i.mi/60} − ${i.tz} = ${f(r.utc_hour,3)} घंटे UTC`,`${i.h+i.mi/60} − ${i.tz} = ${f(r.utc_hour,3)} hours UTC`]],
[["जूलियन डे (JD)","Julian Day (JD)"],
["कंप्यूटर तारीख को एक सीधी संख्या में बदलता है: एक पुरानी तय तारीख से अब तक कितने दिन बीते। इससे ग्रहों की गणना आसान हो जाती है।","The computer turns the date into one plain number: days passed since a fixed ancient date. This makes planet maths simple."],

[["ग्रहों की सायन स्थिति","Planet positions (tropical)"],
["एफेमेरिस (Swiss Ephemeris, NASA के आँकड़ों पर आधारित) बताती है कि उस JD पर हर ग्रह आकाश में कहाँ था। यह पहले सायन (वसंत बिंदु से गिनती) में मिलता है। राहु-केतु असली ग्रह नहीं, चंद्रमा के पथ के बिंदु हैं; केतु = राहु + 180°।","The ephemeris (Swiss Ephemeris, based on NASA data) tells where each planet was at that JD. It first comes in the tropical system (counted from the spring equinox). Rahu-Ketu are not real planets but points on the Moon's path; Ketu = Rahu + 180°."],
[`सूर्य सायन = ${f(sun.trop)}°`,`Sun tropical = ${f(sun.trop)}°`]],
[["अयनांश: सायन से निरयन","Ayanamsa: tropical to sidereal"],

[`अयनांश = ${f(r.ayanamsa,4)}°<br>सूर्य: ${f(sun.trop)} − ${f(r.ayanamsa)} = ${f(sun.lon)}°`,`Ayanamsa = ${f(r.ayanamsa,4)}°<br>Sun: ${f(sun.trop)} − ${f(r.ayanamsa)} = ${f(sun.lon)}°`]],
[["राशि और अंश","Rashi and degree"],
["आकाश के 360° को 12 बराबर राशियों में बाँटा है, हर राशि 30°। राशि संख्या = अंश ÷ 30 (पूर्णांक), राशि के भीतर अंश = शेष।","The 360° sky is split into 12 equal rashi of 30° each. Rashi number = degree ÷ 30 (whole part), degree inside the rashi = remainder."],
[`सूर्य ${f(sun.lon)}° ÷ 30 → ${RASHI[0][si.r]} राशि, ${dm(si.d)}`,`Sun ${f(sun.lon)}° ÷ 30 → ${RASHI[1][si.r]} rashi, ${dm(si.d)}`]],
[["नक्षत्र और पद","Nakshatra and pada"],
["आकाश को 27 नक्षत्रों में भी बाँटा है: 360° ÷ 27 = 13°20'। हर नक्षत्र के 4 पद, हर पद 3°20' का।","The sky is also split into 27 nakshatra: 360° ÷ 27 = 13°20'. Each has 4 padas of 3°20'."],
[`चंद्र ${f(mo.lon)}° → ${NK[0][mi.n]}, पद ${mi.p} (${RASHI[0][mi.r]} राशि)`,`Moon ${f(mo.lon)}° → ${NK[1][mi.n]}, pada ${mi.p} (${RASHI[1][mi.r]} rashi)`]],
[["लग्न","Lagna (ascendant)"],
["जन्म के पल पर पूर्वी क्षितिज पर जो राशि उदय हो रही थी, वही लग्न है। यह जन्म के स्थान के अक्षांश-देशांतर और उस समय के नक्षत्र-काल से निकलता है। इसीलिए जगह और समय दोनों ज़रूरी हैं। लग्न हर लगभग 2 घंटे में बदलता है।","The rashi rising on the eastern horizon at birth is the lagna. It comes from the latitude-longitude and the sidereal time at that moment, which is why both place and time matter. The lagna changes about every 2 hours."],
[`लग्न = ${f(r.lagna)}° → ${RASHI[0][lag]}, ${dm(li.d)}`,`Lagna = ${f(r.lagna)}° → ${RASHI[1][lag]}, ${dm(li.d)}`]],
[["भाव (घर)","Bhav (houses)"],

[`सूर्य ${RASHI[0][si.r]} में है, लग्न ${RASHI[0][lag]} → भाव ${si.h}`,`Sun is in ${RASHI[1][si.r]}, lagna ${RASHI[1][lag]} → house ${si.h}`]],
[["चार्ट बनाना","Drawing the chart"],
["उत्तर भारतीय चार्ट में भाव की जगह तय रहती है: ऊपर का बीच वाला डिब्बा हमेशा पहला भाव (लग्न), फिर घड़ी की उल्टी दिशा में 2, 3 ... 12। डिब्बे के अंदर का अंक राशि संख्या है (1 = मेष ... 12 = मीन) जो लग्न के हिसाब से बदलती है। ग्रह अपनी राशि वाले डिब्बे में लिखे जाते हैं। चक्र चार्ट के रंग सिर्फ देखने के लिए हैं, उनका कोई ज्योतिषीय अर्थ नहीं।","In the North Indian chart, house positions are fixed: the top middle box is always house 1 (lagna), then 2, 3 ... 12 anticlockwise. The number inside a box is the rashi number (1 = Mesh ... 12 = Meen), which changes with the lagna. Each planet goes into the box of its rashi. The colours in the wheel chart are only for viewing and carry no astrological meaning."],
[`आपका लग्न ${lag+1} नंबर की राशि है, इसलिए पहले डिब्बे में ${lag+1} लिखा है।`,`Your lagna is rashi number ${lag+1}, so box 1 shows ${lag+1}.`]],

[`चंद्र ${NK[0][mi.n]} (नक्षत्र ${mi.n+1}) में है → पहली दशा ${GN[0][DO[D.k]]}, ${DY[D.k]} वर्ष। नक्षत्र का ${f(D.fr*100,1)}% बीत चुका, शेष = ${DY[D.k]} × ${f(1-D.fr,3)} = ${ymd(D.bal).join(' वर्ष ')}`.replace(/(\d+) वर्ष (\d+) वर्ष (\d+)$/,'$1 वर्ष $2 माह $3 दिन'),`Moon is in ${NK[1][mi.n]} (nakshatra ${mi.n+1}) → first dasha ${GN[1][DO[D.k]]}, ${DY[D.k]} years. ${f(D.fr*100,1)}% of the nakshatra is crossed, balance = ${DY[D.k]} × ${f(1-D.fr,3)} = ${ymd(D.bal)[0]} yrs ${ymd(D.bal)[1]} months ${ymd(D.bal)[2]} days`]],
[["महादशा और अंतर्दशा की तारीखें","Mahadasha and antardasha dates"],
["पहली दशा के बाद अगली दशाएँ उसी क्रम में चलती हैं, हर एक अपने पूरे वर्षों की। हर महादशा 9 अंतर्दशाओं में बँटती है: पहली उसी ग्रह की, फिर क्रम से बाकी। अंतर्दशा की अवधि = महादशा वर्ष × अंतर्दशा ग्रह के वर्ष ÷ 120। (यहाँ 1 वर्ष = 365.25 दिन।)","After the first dasha, the next ones follow in the same order, each for its full years. Every mahadasha splits into 9 antardashas: the first of the same planet, then the rest in order. Antardasha length = mahadasha years × antardasha planet's years ÷ 120. (Here 1 year = 365.25 days.)"],
[`पहली महादशा ${GN[0][D.list[0].p]}, ${ds(D.list[0].e)} तक। उसकी पहली अंतर्दशा (${GN[0][D.list[0].p]}-${GN[0][D.list[0].p]}): ${DY[D.list[0].i]} × ${DY[D.list[0].i]} ÷ 120 = ${f(DY[D.list[0].i]**2/120,2)} वर्ष। पूरी सूची कुंडली टैब में है।`,`First mahadasha ${GN[1][D.list[0].p]}, till ${ds(D.list[0].e)}. Its first antardasha (${GN[1][D.list[0].p]}-${GN[1][D.list[0].p]}): ${DY[D.list[0].i]} × ${DY[D.list[0].i]} ÷ 120 = ${f(DY[D.list[0].i]**2/120,2)} years. The full list is in the Kundali tab.`]],
[["आगे क्या आएगा","What comes next"],

st("ज्योतिष, गणित और फलित","Jyotish, ganit and falit",
`ज्योतिष के दो हिस्से हैं। <b>गणित</b>: आकाश में सूर्य, चंद्र और ग्रह कहाँ हैं, यह निकालना। यह पक्का गणित है और हमेशा एक जैसा आता है। <b>फलित</b>: उन स्थितियों का अर्थ निकालना, जो शास्त्र के नियमों पर चलता है। इस पूरे ट्यूटोरियल में सिर्फ गणित है।<br>गणित से हम तीन चीज़ें बनाते हैं: <b>कुंडली</b> (जन्म के पल का आकाश), <b>पंचांग</b> (किसी दिन की तिथि, नक्षत्र आदि) और <b>मुहूर्त के समय</b> (दिन के समय-खाने)। तीनों एक ही आकाश के गणित पर बने हैं।`,
`Jyotish has two parts. <b>Ganit</b> (maths): working out where the Sun, Moon and planets are in the sky. This is exact maths and always comes out the same. <b>Falit</b> (results): interpreting those positions, which follows shastra rules. This whole tutorial covers only ganit.<br>With ganit we make three things: the <b>Kundali</b> (the sky at the moment of birth), the <b>Panchang</b> (tithi, nakshatra etc. of any day) and <b>muhurat timings</b> (time slots of the day). All three rest on the same sky maths.`),
st("ज्योतिष की शास्त्रीय शाखाएँ और वेदांग","Classical branches of Jyotish, and the Vedanga",
`परंपरा में ज्योतिष वेद का एक अंग (वेदांग) माना जाता है। छह वेदांगों में इसे वेद की 'आँख' कहा गया है, क्योंकि यज्ञ और अनुष्ठान का सही समय इसी से तय होता था। उपलब्ध सबसे पुराना ग्रंथ लगध का <b>वेदांग ज्योतिष</b> माना जाता है (उसके काल पर विद्वानों में मतभेद है)। बाद में शास्त्र को तीन स्कंधों में बाँटा गया: <b>सिद्धांत / गणित</b> (ग्रहों की गति का गणित), <b>संहिता</b> (मौसम, शकुन, राज्य और समाज से जुड़े विषय) और <b>होरा</b> (जन्म-कुंडली और व्यक्ति से जुड़ा फलित)। बृहत् पाराशर होरा शास्त्र में भी ज्योतिष के होरा, गणित और संहिता, ये तीन विभाग गिनाए गए हैं। आपने जो 'गणित और फलित' सीखा, वह इसी का सरल रूप है: गणित = सिद्धांत वाला भाग, फलित = मुख्यतः होरा (और संहिता)।`,
`In tradition Jyotish is one of the six limbs of the Veda (Vedanga), often called the "eye" of the Veda, because the right time for sacrifices and rituals was fixed by it. The oldest available text is considered to be Lagadha's <b>Vedanga Jyotisha</b> (scholars disagree on its date). Later the science was divided into three skandhas: <b>Siddhanta / Ganita</b> (the maths of planetary motion), <b>Samhita</b> (weather, omens, matters of state and society) and <b>Hora</b> (the birth chart and personal falit). The Brihat Parashara Hora Shastra itself lists these three divisions: Hora, Ganita and Samhita. The "ganit and falit" you learnt is the simple form of this: ganit = the Siddhanta part, falit = mainly Hora (and Samhita).`),
st("आकाश को देखने का तरीका: पृथ्वी स्थिर","How we look at the sky: Earth is still",
`ज्योतिष में पृथ्वी को बीच में स्थिर माना जाता है और हम वहीं खड़े होकर आकाश देखते हैं (भू-केंद्रीय दृष्टि)। इस नज़र से दो अलग चालें दिखती हैं।<br><b>1. रोज़ की चाल:</b> पूरा आकाश पूरब से पश्चिम की ओर घूमता दिखता है। सूर्य पूरब में उगता और पश्चिम में डूबता है, तारे और राशियाँ भी। (असल कारण पृथ्वी का 24 घंटे में अपनी धुरी पर एक चक्कर है, पर हमें आकाश घूमता दिखता है।) इसी से दिन-रात बनते हैं और लग्न बदलता है।<br><b>2. ग्रह की अपनी चाल:</b> हर ग्रह तारों के बीच धीरे-धीरे पश्चिम से पूरब की ओर खिसकता है। जब हम कहते हैं 'सूर्य मेष में है', तो इसी चाल का हिसाब है।<br><b>पथ:</b> सूर्य तारों के बीच जिस रास्ते पर चलता दिखता है उसे क्रांतिवृत्त (ecliptic) कहते हैं। चंद्र और सभी ग्रह इसी के आसपास की पट्टी में रहते हैं। इस पट्टी को 12 हिस्सों में बाँटना ही राशि चक्र है। नीचे चित्र में बीच में पृथ्वी है और बाहर राशि चक्र।<br><i>आधुनिक खगोल कहता है कि पृथ्वी सूर्य के चारों ओर घूमती है। फिर भी 'पृथ्वी से कौन कहाँ दिखता है' का गणित दोनों में एक ही आता है, इसलिए हम पृथ्वी-केंद्रित नज़र से चलते हैं।</i>`,
`In Jyotish the Earth is taken as still at the centre, and we look at the sky from it (the geocentric view). Two different motions are seen.<br><b>1. Daily motion:</b> the whole sky seems to turn from east to west. The Sun rises in the east and sets in the west, and so do the stars and rashis. (The real cause is the Earth turning once on its axis in 24 hours, but to us the sky seems to turn.) This makes day and night and also changes the lagna.<br><b>2. A planet's own motion:</b> every planet slowly drifts among the stars from west to east. When we say "the Sun is in Mesh" we are counting this motion.<br><b>The path:</b> the track the Sun follows among the stars is called the ecliptic. The Moon and all planets stay in a belt around it. Cutting this belt into 12 parts is the rashi chakra. In the picture below the Earth is at the centre and the rashi ring is outside.<br><i>Modern astronomy says the Earth goes around the Sun. Even so, the maths of "who is seen where from Earth" comes out the same either way, so we use the Earth-centred view.</i>`,

st("घूर्णन (Rotation) और परिक्रमा (Revolution)","Rotation and revolution",
`<b>Rotation (घूर्णन)</b> = अपनी धुरी पर घूमना। <b>Revolution (परिक्रमा)</b> = किसी और के चारों ओर चक्कर लगाना। ज्योतिष के गणित में मुख्य रूप से परिक्रमा काम आती है, क्योंकि उसी से आकाश में ग्रह की जगह बदलती है।`+tbl(["पिंड","Rotation","Revolution"],[["पृथ्वी","लगभग 24 घंटे (दिन-रात)","सूर्य के चारों ओर 365.25 दिन"],["चंद्र","27.3 दिन (इसीलिए हमेशा एक ही ओर दिखता है)","पृथ्वी के चारों ओर 27.3 दिन (तारों के हिसाब से)"]])+`<br>आकाश में सूर्य का 'एक चक्कर' पृथ्वी की परिक्रमा से और चंद्र का 'एक चक्कर' चंद्र की परिक्रमा से बनता है।`,
`<b>Rotation</b> = turning on its own axis. <b>Revolution</b> = going around something else. Jyotish maths mainly uses revolution, because that is what changes a body's place in the sky.`+tbl(["Body","Rotation","Revolution"],[["Earth","about 24 hours (day and night)","365.25 days around the Sun"],["Moon","27.3 days (so the same face is always toward us)","27.3 days around the Earth (relative to stars)"]])+`<br>The Sun's "one round" of the sky comes from the Earth's revolution, and the Moon's "one round" from the Moon's own revolution.`),
st("कोण की इकाइयाँ: अंश, कला, विकला","Angle units: degree, arcminute, arcsecond",
`पूरा आकाश एक गोला (360°) है। 1 अंश (°) = 60 कला (') और 1 कला = 60 विकला ("). जैसे 29°30' का मतलब 29 अंश और 30 कला, यानी 29.5°। दशमलव को कला में बदलने के लिए दशमलव वाले हिस्से को 60 से गुणा करें: 0.5 × 60 = 30'। इसी तरह 13°20' = 13.333°, यानी 40/3 अंश।`,
`The whole sky is a circle of 360°. 1 degree (°) = 60 arcminutes (') and 1 arcminute = 60 arcseconds ("). So 29°30' means 29 degrees and 30 minutes, i.e. 29.5°. To turn a decimal into minutes, multiply the decimal part by 60: 0.5 × 60 = 30'. Likewise 13°20' = 13.333°, i.e. 40/3 degrees.`,
[`सूर्य का राशि-अंश ${f(si.d,3)}° → ${Math.floor(si.d)}° और ${f((si.d%1)*60,1)}' = ${dm(si.d)}`,`Sun's degree in its rashi ${f(si.d,3)}° → ${Math.floor(si.d)}° and ${f((si.d%1)*60,1)}' = ${dm(si.d)}`]),
st("समय: 24 घंटे, सौर कैलेंडर और वैदिक समय","Time: 24-hour clock, solar calendar and Vedic time",
`<b>आम (सौर/नागरिक) समय:</b> घड़ी और कैलेंडर सूर्य पर चलते हैं। दिन आधी रात (00:00) से शुरू होकर 24 घंटे चलता है। 24-घंटे के फॉर्मेट में दोपहर के बाद 13:00, 14:00 ... 23:00 लिखते हैं (13:00 = दोपहर 1 बजे)। साल लगभग 365.24 दिन का होता है, इसलिए लीप वर्ष। भारतीय समय IST = UTC + 5:30।<br><b>वैदिक समय:</b> पंचांग का दिन (वार) सूर्योदय से शुरू होता है, आधी रात से नहीं। एक दिन-रात (अहोरात्र) = 60 घटी = 24 घंटे। इकाइयाँ:`+tbl(["इकाई","बराबर","घड़ी में"],[["1 अहोरात्र","60 घटी = 30 मुहूर्त","24 घंटे"],["1 घटी","60 पल","24 मिनट"],["1 पल","60 विपल","24 सेकंड"],["1 मुहूर्त","2 घटी","48 मिनट"],["1 होरा","2.5 घटी","1 घंटा"]])+`घटी को घड़ी में बदलना: घटी × 24 मिनट, फिर सूर्योदय के समय में जोड़ें।`,
`<b>Everyday (solar/civil) time:</b> clocks and calendars follow the Sun. The day runs 24 hours from midnight (00:00). In the 24-hour format afternoon hours are written 13:00, 14:00 ... 23:00 (13:00 = 1 PM). The year is about 365.24 days, hence leap years. Indian time IST = UTC + 5:30.<br><b>Vedic time:</b> the panchang day (vaar) starts at sunrise, not midnight. One day-and-night (ahoratra) = 60 ghati = 24 hours. Units:`+tbl(["Unit","Equals","On the clock"],[["1 ahoratra","60 ghati = 30 muhurta","24 hours"],["1 ghati","60 pal","24 minutes"],["1 pal","60 vipal","24 seconds"],["1 muhurta","2 ghati","48 minutes"],["1 hora","2.5 ghati","1 hour"]])+`To convert ghati to clock time: ghati × 24 minutes, then add it to the sunrise time.`,
[`${pd}: सूर्योदय ${sr}। सूर्योदय के 5 घटी बाद = 5 × 24 = 120 मिनट बाद = ${addMin(sr,120)}`,`${pd}: sunrise ${sr}. 5 ghati after sunrise = 5 × 24 = 120 minutes later = ${addMin(sr,120)}`])]},
{t:["ग्रह और उनकी चाल","Planets and their motion"],s:[
st("नौ ग्रह: कौन असली, कौन बिंदु","The nine grah: real bodies and points",
`ज्योतिष में 9 ग्रह गिने जाते हैं। सूर्य और चंद्र को 'प्रकाशक' कहते हैं (असल में तारा और उपग्रह, पर यहाँ ग्रह गिने जाते हैं)। मंगल, बुध, गुरु, शुक्र, शनि असली ग्रह हैं। राहु और केतु कोई पिंड नहीं हैं: ये चंद्र के रास्ते और सूर्य के रास्ते के दो कटान-बिंदु हैं, जो हमेशा एक-दूसरे से ठीक 180° दूर रहते हैं। तालिका में हर ग्रह को राशि चक्र का एक पूरा चक्कर लगाने में लगने वाला लगभग समय है:`+tbl(["ग्रह","एक चक्कर में लगभग","रोज़ की औसत चाल"],[[GN[0][0],"1 साल","≈ 1°"],[GN[0][1],"27.3 दिन","≈ 13.2°"],[GN[0][2],"1.9 साल","≈ 0.5°"],[GN[0][3],"1 साल (सूर्य के पास ही)","≈ 1°"],[GN[0][4],"11.9 साल","≈ 0.08°"],[GN[0][5],"1 साल (सूर्य के पास ही)","≈ 1°"],[GN[0][6],"29.5 साल","≈ 0.03°"],[GN[0][7]+" / "+GN[0][8],"18.6 साल (उल्टी दिशा में)","≈ 0.05° पीछे"]]),
`Jyotish counts 9 grah. The Sun and Moon are called luminaries (really a star and a satellite, but counted as grah here). Mars, Mercury, Jupiter, Venus and Saturn are real planets. Rahu and Ketu are not bodies: they are the two points where the Moon's path crosses the Sun's path, always exactly 180° apart. The table gives the approximate time each takes to go once around the zodiac:`+tbl(["Grah","Time for one round","Average daily motion"],[[GN[1][0],"1 year","≈ 1°"],[GN[1][1],"27.3 days","≈ 13.2°"],[GN[1][2],"1.9 years","≈ 0.5°"],[GN[1][3],"1 year (stays near the Sun)","≈ 1°"],[GN[1][4],"11.9 years","≈ 0.08°"],[GN[1][5],"1 year (stays near the Sun)","≈ 1°"],[GN[1][6],"29.5 years","≈ 0.03°"],[GN[1][7]+" / "+GN[1][8],"18.6 years (backwards)","≈ 0.05° back"]])),
st("वक्री: जब ग्रह उल्टा चलता दिखे","Vakri: when a planet seems to go backward",
`कभी-कभी मंगल से शनि तक के ग्रह और बुध-शुक्र कुछ समय के लिए तारों के बीच पीछे की ओर चलते दिखते हैं। इसे वक्री कहते हैं। कारण: जैसे तेज़ चलती गाड़ी से धीमी गाड़ी को पार करते समय वह पीछे जाती दिखती है, वैसे ही पृथ्वी जब किसी ग्रह को पार करती है तो वह पीछे जाता दिखता है। सूर्य और चंद्र कभी वक्री नहीं होते। राहु-केतु (औसत गणना में) हमेशा उल्टे चलते हैं। इस ऐप की तालिका में वक्री ग्रह के आगे (वक्री) लिखा आता है। वक्री का फलित में क्या अर्थ है, यह बाद में।`,
`At times Mars to Saturn and also Mercury and Venus seem to move backward among the stars for a while. This is called vakri (retrograde). Reason: just as a slower car seems to go backward when a faster car overtakes it, a planet seems to go backward when the Earth passes it. The Sun and Moon are never vakri. Rahu-Ketu (in the mean calculation) always move backward. In this app's table a vakri planet is marked (retro). What vakri means in falit comes later.`),
st("ग्रहों के नाम, वार, दशा-वर्ष और नक्षत्र","Names, weekday, dasha years and nakshatras of the grah",
`नीचे हर ग्रह के पर्यायवाची नाम (पुराने ग्रंथ पढ़ते समय काम आते हैं), उसका वार, विंशोत्तरी दशा के वर्ष और वे तीन नक्षत्र हैं जिनका दशा-स्वामी वही ग्रह है। नक्षत्र-स्वामियों का क्रम केतु, शुक्र, सूर्य, चंद्र, मंगल, राहु, गुरु, शनि, बुध है; यह अश्विनी से शुरू होकर हर 9 नक्षत्र बाद दोहराता है।`+tbl(["ग्रह","अन्य नाम","वार","दशा वर्ष","नक्षत्र"],GRT),
`Below, for each grah: its synonyms (useful when reading old texts), its weekday, its Vimshottari dasha years and the three nakshatras whose dasha lord it is. The order of nakshatra lords is Ketu, Venus, Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury; it starts at Ashwini and repeats every 9 nakshatras.`+tbl(["Grah","Other names","Weekday","Dasha years","Nakshatras"],GRT)),
st("बुध और शुक्र सूर्य से दूर क्यों नहीं जाते","Why Mercury and Venus never go far from the Sun",
`बुध और शुक्र की कक्षाएँ पृथ्वी की कक्षा के भीतर हैं, इसलिए पृथ्वी से देखने पर ये सूर्य के आसपास ही दिखते हैं। बुध सूर्य से अधिकतम लगभग 28° और शुक्र लगभग 47° तक दूर जा पाता है। इसका सीधा नतीजा: बुध हमेशा सूर्य वाली राशि में या उसके बगल की राशि में मिलता है (28° < 30°), और शुक्र अधिक से अधिक दो राशि दूर तक। यह आप अपनी हर कुंडली में जाँच सकते हैं।`,
`Mercury's and Venus's orbits lie inside the Earth's orbit, so from Earth they are always seen near the Sun. Mercury gets at most about 28° from the Sun and Venus about 47°. The direct result: Mercury is always in the Sun's rashi or the one next to it (28° < 30°), and Venus at most two rashis away. You can check this in any kundali.`,
[`आपकी कुंडली: ${GN[0][3]} और ${GN[0][0]} में अंतर ${f(dd(r.planets[3].lon,sun.lon))}° (28° से कम); ${GN[0][5]} और ${GN[0][0]} में ${f(dd(r.planets[5].lon,sun.lon))}° (47° से कम)`,`Your kundali: ${GN[1][3]} to ${GN[1][0]} ${f(dd(r.planets[3].lon,sun.lon))}° (under 28°); ${GN[1][5]} to ${GN[1][0]} ${f(dd(r.planets[5].lon,sun.lon))}° (under 47°)`]),
st("राहु-केतु और ग्रहण (गणित)","Rahu-Ketu and eclipses (the maths)",
`राहु-केतु वे दो बिंदु हैं जहाँ चंद्र का रास्ता सूर्य के रास्ते (क्रांतिवृत्त) को काटता है। चंद्र का रास्ता क्रांतिवृत्त से लगभग 5° झुका है, इसलिए हर अमावस्या पर सूर्य ग्रहण नहीं होता और हर पूर्णिमा पर चंद्र ग्रहण नहीं। ग्रहण तभी होता है जब अमावस्या या पूर्णिमा इन बिंदुओं के पास पड़े (मोटे तौर पर सूर्य ग्रहण के लिए सूर्य राहु/केतु से लगभग 15-18° के भीतर, चंद्र ग्रहण के लिए लगभग 10-12° के भीतर; ये आँकड़े अनुमानित हैं)। सूर्य को राहु-केतु की रेखा पार करने में लगभग 173 दिन लगते हैं, इसीलिए ग्रहण के मौसम लगभग हर 6 महीने में आते हैं।`,
`Rahu and Ketu are the two points where the Moon's path crosses the Sun's path (the ecliptic). The Moon's path is tilted about 5° to the ecliptic, so there is no solar eclipse at every Amavasya and no lunar eclipse at every Purnima. An eclipse happens only when the Amavasya or Purnima falls near these points (roughly, for a solar eclipse the Sun must be within about 15-18° of Rahu/Ketu, for a lunar eclipse within about 10-12°; these figures are approximate). The Sun takes about 173 days to cross the Rahu-Ketu line, which is why eclipse seasons come about every 6 months.`,
[`${pd}: सूर्य से राहु-केतु रेखा की दूरी = ${f(Math.min(dd(tr[0].lon,tr[7].lon),dd(tr[0].lon,tr[8].lon)))}°`,`${pd}: the Sun's distance from the Rahu-Ketu line = ${f(Math.min(dd(tr[0].lon,tr[7].lon),dd(tr[0].lon,tr[8].lon)))}°`])]},
{t:["राशि","Rashi"],s:[
st("12 राशियाँ: आकाश के 30° के हिस्से","12 rashi: 30° parts of the sky",
`राशि चक्र (360°) को 12 बराबर हिस्सों में बाँटा गया है, हर हिस्सा 30° का। हर हिस्से का एक नाम और क्रम संख्या है। राशियाँ तारों के झुंड नहीं, बराबर नाप के हिस्से हैं। क्रम वही है जिस दिशा में ग्रह चलते हैं: मेष से मीन की ओर। आकाश में राशियाँ अपनी जगह पर स्थिर रहती हैं; बदलता है तो लग्न (कौन सी राशि पूरब में उग रही है)।`+tbl(["संख्या","राशि","अंश"],rt),
`The zodiac (360°) is cut into 12 equal parts of 30° each. Each part has a name and a serial number. Rashis are equal measures, not star groups. The order is the direction in which planets move: Mesh towards Meen. In the sky the rashis stay fixed in place; what changes is the lagna (which rashi is rising in the east).`+tbl(["No.","Rashi","Degrees"],rt)),
st("अंश से राशि निकालना (और उल्टा)","From degree to rashi (and back)",
`नियम: ग्रह के पूरे अंश (0 से 360) को 30 से भाग दें। भागफल = कितनी राशियाँ पूरी हो चुकीं, शेष = वर्तमान राशि में अंश। राशि संख्या = भागफल + 1।<br>उदाहरण 1: 45° ÷ 30 = 1, शेष 15 → 2 नंबर की राशि वृषभ, 15°।<br>उदाहरण 2: 359.5° ÷ 30 = 11, शेष 29.5 → 12 नंबर की राशि मीन, 29°30'।<br>उल्टा: मिथुन 10° = (2 पूरी राशि × 30) + 10 = 70°।`,
`Rule: divide the planet's full degree (0 to 360) by 30. The quotient = how many rashis are complete, the remainder = degrees inside the current rashi. Rashi number = quotient + 1.<br>Example 1: 45° ÷ 30 = 1, remainder 15 → rashi number 2, Vrishabh, 15°.<br>Example 2: 359.5° ÷ 30 = 11, remainder 29.5 → rashi number 12, Meen, 29°30'.<br>Reverse: Mithun 10° = (2 complete rashis × 30) + 10 = 70°.`)]},
{t:["नक्षत्र","Nakshatra"],s:[
st("27 नक्षत्र क्यों?","Why 27 nakshatras?",
`चंद्र तारों के बीच एक चक्कर लगभग 27.3 दिन में पूरा करता है, यानी रोज़ लगभग एक नए तारा-समूह के पास रात बिताता है। इसीलिए आकाश को 27 हिस्सों में बाँटा गया: 360° ÷ 27 = 13°20'। हर हिस्से का नाम एक नक्षत्र है। हर नक्षत्र के 4 पद (चरण) होते हैं, हर पद 3°20' का। यानी कुल 27 × 4 = 108 पद, और 108 ÷ 12 = 9 पद हर राशि में। इसलिए एक राशि में 2¼ नक्षत्र आते हैं और नक्षत्र की सीमा राशि की सीमा से मेल नहीं खाती: कुछ नक्षत्र दो राशियों में फैले होते हैं (जैसे कृत्तिका: मेष 26°40' से वृषभ 10° तक)।`,
`The Moon takes about 27.3 days to go once around the stars, so it spends each night near a new star group. That is why the sky is split into 27 parts: 360° ÷ 27 = 13°20'. Each part is a nakshatra. Each nakshatra has 4 padas (quarters), each 3°20'. That makes 27 × 4 = 108 padas, and 108 ÷ 12 = 9 padas in each rashi. So one rashi holds 2¼ nakshatras and nakshatra borders do not match rashi borders: some nakshatras are spread over two rashis (for example Krittika: Mesh 26°40' to Vrishabh 10°).`),
st("27 नक्षत्रों की सूची","List of the 27 nakshatras",
`हर नक्षत्र कहाँ से कहाँ तक है, नीचे की तालिका में है।`+`<details><summary style="cursor:pointer">27 ...</summary>${tbl(NTH,nt)}</details>`,
`The table below shows where each nakshatra starts and ends.`+`<details><summary style="cursor:pointer">27 ...</summary>${tbl(NTH,nt)}</details>`),
st("नक्षत्र-स्वामी का क्रम (दशा से जुड़ाव)","The cycle of nakshatra lords (link with dasha)",
`27 नक्षत्रों को नौ ग्रह बारी-बारी से बाँटते हैं: केतु, शुक्र, सूर्य, चंद्र, मंगल, राहु, गुरु, शनि, बुध। यह क्रम अश्विनी से शुरू होकर तीन बार दोहराता है, इसलिए हर ग्रह के 3 नक्षत्र होते हैं (तालिका में 'दशा स्वामी')। मज़ेदार गणित: तीनों चक्र ठीक राशि की शुरुआत से शुरू होते हैं। अश्विनी मेष 0° से, मघा सिंह 0° से और मूल धनु 0° से, यानी 0°, 120° और 240° पर, और तीनों के स्वामी केतु हैं। विंशोत्तरी दशा में जन्म का पहला दशा-स्वामी चंद्र के नक्षत्र के इसी स्वामी से तय होता है।`,
`The nine grah take turns over the 27 nakshatras: Ketu, Venus, Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury. The order starts at Ashwini and repeats three times, so each grah has 3 nakshatras (the 'Dasha lord' column). A neat bit of maths: all three cycles begin exactly at the start of a rashi. Ashwini starts at Mesh 0°, Magha at Singh 0° and Mula at Dhanu 0°, i.e. at 0°, 120° and 240°, and all three are ruled by Ketu. In Vimshottari dasha the first dasha lord at birth comes from this lord of the Moon's nakshatra.`),
st("अभिजित: 28वाँ नक्षत्र","Abhijit: the 28th nakshatra",
`मुहूर्त की कुछ गणनाओं में 28वाँ नक्षत्र 'अभिजित' भी गिना जाता है। परंपरा में यह उत्तराषाढ़ा के आख़िरी चौथाई और श्रवण के शुरुआती थोड़े से हिस्से को मिलाकर माना जाता है, यानी मकर 6°40' से लगभग 10°53'20" तक। इसे 27 वाली मुख्य गिनती में अलग से नहीं गिना जाता, इसलिए दशा आदि के गणित में यह नहीं आता।`,
`In some muhurta calculations a 28th nakshatra, 'Abhijit', is also counted. Traditionally it is taken as the last quarter of Uttara Ashadha plus a small beginning part of Shravana, i.e. from Makar 6°40' to about 10°53'20". It is not counted separately in the main 27-nakshatra system, so it does not enter dasha maths.`)]},
{t:["भाव (घर)","Bhav (houses)"],s:[
st("भाव क्या है?","What is a bhav?",
`<b>राशि</b> आकाश में स्थिर 12 हिस्से हैं। <b>भाव</b> उन्हीं 12 हिस्सों को कुंडली में गिनने का एक तरीका है, जिसमें गिनती लग्न से शुरू होती है। उदाहरण: आकाश के 12 कुर्सी वाले हॉल की कुर्सियाँ पहले से नंबर वाली हैं (राशि)। अब जो कुर्सी पूर्वी दरवाज़े के ठीक सामने है, उसे नंबर 1 मानकर गिनती नए सिरे से शुरू करें (भाव)। लग्न हर लगभग 2 घंटे में बदलता है, इसलिए भाव की गिनती हर कुंडली की अलग होती है, भले राशियाँ वही रहें।`,
`A <b>rashi</b> is one of 12 fixed parts of the sky. A <b>bhav</b> is a way of counting those same 12 parts inside a kundali, where the counting starts from the lagna. Think of a hall with 12 chairs already numbered (rashis). Now take the chair facing the eastern door as number 1 and count again from there (bhavs). The lagna changes about every 2 hours, so the bhav counting differs from kundali to kundali even though the rashis are the same.`),
st("भाव की गिनती कैसे होती है","How bhavs are counted",
`यहाँ 'पूरी राशि भाव' (Whole Sign) पद्धति है: लग्न की राशि पूरी की पूरी पहला भाव, अगली राशि दूसरा भाव, ... और 12वीं मीन तक। सूत्र: ग्रह का भाव = (ग्रह की राशि संख्या − लग्न राशि संख्या) को 12 से घुमाकर + 1।<br><b>गिनती में शुरू का भाव भी गिना जाता है।</b> इसलिए '1 से 7वाँ' का मतलब 6 कदम आगे, यानी बिल्कुल सामने का भाव (180°)। किसी भी भाव X से n-वाँ भाव = ((X + n − 2) को 12 से घुमाकर) + 1, जैसे 4 से 7वाँ = 10। यही गिनती किसी ग्रह की जगह से भी की जा सकती है।<br>आपकी कुंडली के लिए (लग्न ${RASHI[0][lag]}):`+tbl(["भाव","राशि","राशि संख्या"],bt),
`This app uses the Whole Sign method: the lagna rashi, all of it, is house 1, the next rashi is house 2, and so on up to house 12. Formula: planet's house = (planet's rashi number − lagna rashi number, wrapped around 12) + 1.<br><b>In counting, the starting house is also counted.</b> So "7th from the 1st" means 6 steps ahead, i.e. the house directly opposite (180°). The n-th house from any house X = ((X + n − 2) wrapped around 12) + 1, for example the 7th from 4 is 10. The same counting can be done from a planet's position too.<br>For your kundali (lagna ${RASHI[1][lag]}):`+tbl(["House","Rashi","Rashi no."],bt),
null,bhavSvg(lag)),
st("चार्ट में भाव की जगह","Where bhavs sit in the chart",
`उत्तर भारतीय चार्ट में भाव की जगह पक्की है: ऊपर का बीच वाला डिब्बा हमेशा भाव 1 (लग्न), फिर घड़ी की उल्टी दिशा में 2, 3 ... 12। बदलती है तो डिब्बे के अंदर की राशि। दक्षिण भारतीय चार्ट में उल्टा है: राशियों की जगह पक्की है और लग्न वाला डिब्बा निशान से बताया जाता है (इस ऐप में अभी उत्तर भारतीय है)। कुछ और पद्धतियाँ भी हैं (जैसे भाव चलित, श्रीपति) जिनमें भाव की सीमाएँ राशि की सीमा पर नहीं कटतीं। यहाँ हम सिर्फ पूरी राशि भाव पद्धति इस्तेमाल करते हैं।`,
`In the North Indian chart bhav positions are fixed: the top middle box is always house 1 (lagna), then 2, 3 ... 12 anticlockwise. What changes is the rashi written inside each box. The South Indian chart is the opposite: rashi positions are fixed and the lagna box is marked. (This app currently shows the North Indian style.) There are other methods too (such as Bhav Chalit, Sripati) where house borders do not follow rashi borders. Here we use only the Whole Sign method.`)]},
{t:["कुंडली कैसे बनती है","How a kundali is made"],s:[S[0],S[1],S[2],S[3],S[4],S[5],S[6],S[7],
st("लग्न: 4 मिनट में 1°","Lagna: 1° in 4 minutes",
`पृथ्वी 24 घंटे में एक चक्कर लगाती है, इसलिए पूरा राशि चक्र (360°) 24 घंटे में पूर्वी क्षितिज से गुज़रता है। 360° ÷ 24 घंटे = 15° प्रति घंटा, यानी लगभग 1° हर 4 मिनट। एक राशि (30°) को उगने में औसतन 2 घंटे लगते हैं (अक्षांश के हिसाब से कोई राशि जल्दी, कोई देर से उगती है)। इसीलिए जन्म-समय में सिर्फ 4 मिनट की गलती लग्न के अंश को 1° खिसका देती है, और लग्न राशि के किनारे पर हो तो राशि ही बदल सकती है।`,
`The Earth turns once in 24 hours, so the whole zodiac (360°) crosses the eastern horizon in 24 hours. 360° ÷ 24 hours = 15° per hour, i.e. about 1° every 4 minutes. One rashi (30°) takes about 2 hours to rise on average (depending on latitude some rashis rise faster, some slower). So an error of just 4 minutes in birth time moves the lagna degree by 1°, and if the lagna is near a rashi edge the rashi itself can change.`,
[`आपका लग्न ${RASHI[0][lag]} ${dm(li.d)} पर है। अगली राशि शुरू होने में लगभग ${Math.round((30-li.d)*4)} मिनट बचे।`,`Your lagna is at ${RASHI[1][lag]} ${dm(li.d)}. About ${Math.round((30-li.d)*4)} minutes remain before the next rashi starts.`]),

{t:["दशा","Dasha"],s:[
st("दशा क्या है (गणित वाला हिस्सा)","What is dasha (the maths part)",
`दशा जीवन के समय को ग्रहों के खंडों में बाँटने की एक पद्धति है। विंशोत्तरी दशा में कुल 120 साल का चक्र है और उसमें 9 ग्रहों की बारी और साल तय हैं। शुरुआत चंद्र के नक्षत्र से होती है: जन्म के पल चंद्र अपने नक्षत्र में कितना आगे बढ़ चुका था, उसी से पता चलता है कि जन्म किस ग्रह की दशा के किस हिस्से में हुआ। हर दशा के भीतर छोटी दशाएँ (अंतर्दशा) चलती हैं। (किस दशा का क्या फल माना जाता है, यह फलित है।)`,
`Dasha is a method of dividing life's time into periods ruled by the grah. Vimshottari dasha is a 120-year cycle with a fixed turn and number of years for each of the 9 grah. It starts from the Moon's nakshatra: how far the Moon had moved through its nakshatra at birth shows which grah's period, and how much of it, was running at birth. Inside each dasha run smaller periods (antardasha). (What a dasha is believed to bring is falit.)`),

{t:["पंचांग","Panchang"],s:[
st("पंचांग क्या है?","What is a panchang?",
`पंचांग = पंच (पाँच) + अंग (हिस्से)। यह भारतीय पंचांग (almanac) है जो हर दिन के पाँच अंग बताता है: <b>तिथि, वार, नक्षत्र, योग, करण</b>। साथ में सूर्योदय, सूर्यास्त, राहुकाल जैसे समय भी लिखे होते हैं। आम कैलेंडर सिर्फ तारीख बताता है और सूर्य पर आधारित है। पंचांग चंद्र और सूर्य की स्थिति से दिन की पहचान बताता है। इसी से त्योहार, व्रत और मुहूर्त की तारीखें तय होती हैं।`+tbl(["अंग","किस पर आधारित","नाप"],[["तिथि","चंद्र − सूर्य का कोण","12°"],["वार","सूर्योदय से सूर्योदय तक का दिन","7 दिन का चक्र"],["नक्षत्र","चंद्र की जगह","13°20'"],["योग","सूर्य + चंद्र का जोड़","13°20'"],["करण","तिथि का आधा","6°"]]),
`Panchang = pancha (five) + anga (limbs). It is the Indian almanac that gives five limbs for each day: <b>tithi, vaar, nakshatra, yoga, karan</b>. It also lists times such as sunrise, sunset and Rahu Kaal. An ordinary calendar only gives the date and follows the Sun. The panchang identifies a day by the positions of the Moon and Sun. Dates of festivals, fasts and muhurats are fixed from it.`+tbl(["Limb","Based on","Measure"],[["Tithi","Moon − Sun angle","12°"],["Vaar","day from sunrise to sunrise","7-day cycle"],["Nakshatra","Moon's place","13°20'"],["Yoga","Sun + Moon sum","13°20'"],["Karan","half a tithi","6°"]])),
st("चंद्र की गति से समय कैसे गिना जाता है","How time is counted from the Moon's motion",
`चंद्र रोज़ तारों के बीच लगभग 13.2° आगे बढ़ता है और सूर्य लगभग 1°। इसलिए चंद्र हर दिन सूर्य से लगभग 12.2° आगे निकल जाता है। सूर्य और चंद्र के बीच के कोण (चंद्र − सूर्य) से तिथि बनती है। <b>0° (अमावस्या)</b>: दोनों एक ही दिशा में। <b>90°</b>: आधा चाँद, बढ़ता हुआ। <b>180° (पूर्णिमा)</b>: दोनों आमने-सामने, पूरा चाँद। <b>270°</b>: आधा चाँद, घटता हुआ। फिर 360° पर दोबारा अमावस्या। हर 12° = 1 तिथि, इसलिए 30 तिथि = 360°। 0° से 180° शुक्ल पक्ष (चाँद बढ़ता है) और 180° से 360° कृष्ण पक्ष (चाँद घटता है)। चित्र में नीला कोण यही चंद्र − सूर्य है।<br><b>दो अलग महीने:</b> तारों के हिसाब से चंद्र को एक चक्कर में ~27.3 दिन लगते हैं (नक्षत्र मास)। तब तक सूर्य भी ~27° आगे जा चुका होता है, इसलिए चंद्र को सूर्य से दोबारा मिलने (अमावस्या से अमावस्या) में ~29.53 दिन लगते हैं (चांद्र मास)। 29.53 दिन ÷ 30 तिथि = औसतन 23 घंटे 37 मिनट प्रति तिथि। पर चंद्र की चाल एक-सी नहीं रहती (कभी तेज़, कभी धीमी), इसलिए एक तिथि लगभग 19 से 26 घंटे की हो सकती है। इसी से तिथि का समय हर दिन अलग होता है, और कभी एक तिथि दो दिन छू लेती है या कोई तिथि किसी सूर्योदय पर आती ही नहीं।`,
`The Moon moves about 13.2° a day among the stars and the Sun about 1°. So each day the Moon gets about 12.2° ahead of the Sun. The angle between them (Moon − Sun) makes the tithi. <b>0° (Amavasya)</b>: both in the same direction. <b>90°</b>: half moon, growing. <b>180° (Purnima)</b>: face to face, full moon. <b>270°</b>: half moon, shrinking. At 360° it is Amavasya again. Every 12° = 1 tithi, so 30 tithis = 360°. 0° to 180° is Shukla paksha (the Moon grows) and 180° to 360° is Krishna paksha (the Moon shrinks). In the picture the shaded angle is this Moon − Sun.<br><b>Two different months:</b> relative to the stars the Moon takes ~27.3 days for one round (nakshatra month). By then the Sun has also moved ~27° ahead, so the Moon needs ~29.53 days to meet the Sun again (Amavasya to Amavasya, the lunar month). 29.53 days ÷ 30 tithis = on average 23 hours 37 minutes per tithi. But the Moon's speed is not steady (sometimes faster, sometimes slower), so one tithi can last roughly 19 to 26 hours. That is why tithi timings differ every day, and why a tithi sometimes touches two days or never falls on any sunrise.`,
[`आपके चुने दिन: चंद्र − सूर्य = ${f(q.moon_lon)} − ${f(q.sun_lon)} = ${f(q.elong)}° → तिथि ${q.tithi.n}`,`On your chosen day: Moon − Sun = ${f(q.moon_lon)} − ${f(q.sun_lon)} = ${f(q.elong)}° → tithi ${q.tithi.n}`],sk2+tithiBar(q.tithi.n)),
st("चांद्र मास, सौर वर्ष और अधिक मास","Lunar month, solar year and adhik maas",
`आम कैलेंडर (ग्रेगोरियन) सौर है: साल सूर्य के हिसाब से 365.24 दिन का और महीने 28-31 दिन के तय। हिंदू पंचांग चांद्र-सौर है: महीना चंद्र से (अमावस्या से अमावस्या ~29.53 दिन), साल सूर्य से। 12 चांद्र मास = लगभग 354.4 दिन, जो सौर वर्ष से लगभग 11 दिन कम है। यह अंतर हर साल जमा होता है और करीब 32.5 महीने में एक महीने जितना हो जाता है। तब एक <b>अधिक मास</b> जोड़ा जाता है ताकि त्योहार अपनी ऋतु में बने रहें। (नियम: जिस चांद्र मास में सूर्य किसी राशि में प्रवेश नहीं करता, यानी संक्रांति नहीं पड़ती, वह अधिक मास बनता है।) महीनों के नाम (चैत्र, वैशाख...) इस पर पड़े कि पूर्णिमा को चंद्र किस नक्षत्र में रहता है (चित्रा → चैत्र)। महीना कहाँ से शुरू गिना जाए, इसकी दो पद्धतियाँ हैं: अमांत (अमावस्या से) और पूर्णिमांत (पूर्णिमा से)।`+tbl(["","आम कैलेंडर","पंचांग"],[["दिन शुरू होता है","आधी रात","सूर्योदय"],["महीने का आधार","तय 28-31 दिन","चंद्र चक्र, 29-30 दिन"],["साल","365/366 दिन","354 दिन + अधिक मास"],["तारीख का आधार","सूर्य","तिथि (चंद्र-सूर्य कोण)"]]),
`The everyday (Gregorian) calendar is solar: the year follows the Sun at 365.24 days and months are fixed at 28-31 days. The Hindu panchang is luni-solar: the month follows the Moon (Amavasya to Amavasya, ~29.53 days) and the year follows the Sun. 12 lunar months = about 354.4 days, around 11 days shorter than a solar year. This gap builds up every year and reaches about one month in roughly 32.5 months. Then an <b>adhik maas</b> (extra month) is added so festivals stay in their season. (Rule: a lunar month in which the Sun does not enter any new rashi, i.e. no sankranti falls, becomes the adhik maas.) Month names (Chaitra, Vaishakh...) come from the nakshatra the Moon is in on that month's Purnima (Chitra → Chaitra). There are two ways to decide where a month starts: amanta (from Amavasya) and purnimanta (from Purnima).`+tbl(["","Everyday calendar","Panchang"],[["Day starts at","midnight","sunrise"],["Month based on","fixed 28-31 days","Moon cycle, 29-30 days"],["Year","365/366 days","354 days + adhik maas"],["Date based on","the Sun","tithi (Moon-Sun angle)"]])),
S2[0],
st("घड़ी की तारीख बनाम वार","Clock date versus vaar",
`घड़ी में तारीख आधी रात को बदलती है, पर पंचांग का वार सूर्योदय को बदलता है। इसलिए अगर घड़ी में बुधवार की तारीख को रात 1 बजे किसी का जन्म हुआ, तो वार मंगलवार गिना जाएगा, क्योंकि बुधवार का सूर्योदय अभी हुआ नहीं। तिथि भी इसी तरह: पंचांग में जिस तिथि पर सूर्योदय पड़े, वही उस दिन की तिथि मानी जाती है।`,
`On the clock the date changes at midnight, but the panchang vaar changes at sunrise. So if someone is born at 1 AM on a clock date that is a Wednesday, the vaar counts as Tuesday, because Wednesday's sunrise has not happened yet. Tithi works the same way: the tithi running at sunrise is taken as that day's tithi.`),
S2[1],S2[2],S2[3],S2[4],S2[5],S2[6]]},
{t:["हिंदू कैलेंडर","The Hindu calendar"],s:[
st("सात वार का सप्ताह कैसे बना","How the 7-day week came about",
`सप्ताह के वार <b>होरा</b> की गिनती से निकलते हैं। पहले ग्रहों को चाल की धीमी से तेज़ क्रम में रखें: शनि, गुरु, मंगल, सूर्य, शुक्र, बुध, चंद्र। अब दिन के हर घंटे (होरा) को इसी क्रम में एक-एक ग्रह दें और चक्र दोहराते जाएँ। जिस ग्रह की होरा से दिन शुरू हो, वही उस दिन का वार है। एक दिन में 24 होरा होती हैं और 24 ÷ 7 का शेष 3 है, इसलिए अगले दिन की पहली होरा क्रम में 3 ग्रह आगे वाले की होती है। इसी से रवि, सोम, मंगल, बुध, गुरु, शुक्र, शनि का क्रम बनता है।`+tbl(["दिन","वार","पहली होरा (24×दिन ÷ 7 का शेष)","ग्रह"],[...Array(7)].map((_,k)=>[k+1,VRN[0][k],(24*k)%7,GN[0][[0,5,3,1,6,4,2][(3*k)%7]]]))+`<b>इतिहास:</b> इतिहासकार मानते हैं कि ग्रहों के नाम वाला सात वारों का सप्ताह भारतीय ज्योतिष ग्रंथों में ईसा की शुरुआती सदियों के आसपास (जैसे यवनजातक में) मिलता है, और इसमें ग्रीक-मिस्र की होरा-पद्धति से संपर्क का असर माना जाता है। परंपरा इसे प्राचीन भारतीय मानती है। दोनों मत मिलते हैं। वैदिक अनुष्ठानों का समय मुख्यतः तिथि, नक्षत्र और ऋतु से तय होता था।`,
`The weekdays come out of the <b>hora</b> count. First put the grah in order from slowest to fastest: Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon. Now give each hour (hora) of the day one grah in this order, repeating the cycle. The grah whose hora starts the day is that day's lord (vaar). A day has 24 horas and 24 ÷ 7 leaves a remainder of 3, so the first hora of the next day belongs to the grah 3 places ahead in the order. This gives the sequence Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn.`+tbl(["Day","Vaar","First hora (24×day ÷ 7 remainder)","Grah"],[...Array(7)].map((_,k)=>[k+1,VRN[1][k],(24*k)%7,GN[1][[0,5,3,1,6,4,2][(3*k)%7]]]))+`<b>History:</b> historians think the seven-day week named after the grah appears in Indian astronomical texts around the early centuries CE (for example in the Yavanajataka) and see the influence of Greek-Egyptian hora systems. Tradition holds it to be ancient Indian. Both views exist. Vedic rituals were timed mainly by tithi, nakshatra and season.`),
st("तिथि से महीना: अमांत और पूर्णिमांत","From tithi to month: amanta and purnimanta",
`एक अमावस्या से अगली अमावस्या तक का समय (लगभग 29.5 दिन) एक चांद्र मास है। इसे <b>अमांत</b> पद्धति कहते हैं (अमा-अंत: अमावस्या पर महीना खत्म)। दूसरी पद्धति <b>पूर्णिमांत</b> है, जिसमें महीना पूर्णिमा से पूर्णिमा तक गिना जाता है। दोनों में शुक्ल पक्ष का महीना एक ही रहता है; फर्क सिर्फ कृष्ण पक्ष के महीने के नाम का है (पूर्णिमांत में कृष्ण पक्ष अगले महीने का गिना जाता है)। आम तौर पर उत्तर भारत में पूर्णिमांत और महाराष्ट्र, कर्नाटक, आंध्र आदि में अमांत चलता है। इसीलिए एक ही दिन का 'महीना' उत्तर और दक्षिण के पंचांग में अलग लिखा मिल सकता है।`,
`The time from one Amavasya to the next (about 29.5 days) is one lunar month. This is the <b>amanta</b> system (ama-anta: the month ends at Amavasya). The other system is <b>purnimanta</b>, where the month runs from Purnima to Purnima. The Shukla paksha has the same month in both; the difference is only in the name of the month for the Krishna paksha (in purnimanta the Krishna paksha counts as the next month). Generally purnimanta is followed in North India and amanta in Maharashtra, Karnataka, Andhra and so on. So the 'month' of the same day can be written differently in northern and southern panchangs.`,
[`${pd}: पिछली अमावस्या ${lu.nm_prev}, अगली ${lu.nm_next}। अमांत मास ${MN[0][lu.m-1]}${lu.adhik?' (अधिक)':''}, पूर्णिमांत ${MN[0][lu.pm-1]}`,`${pd}: previous Amavasya ${lu.nm_prev}, next ${lu.nm_next}. Amanta month ${MN[1][lu.m-1]}${lu.adhik?' (adhik)':''}, purnimanta ${MN[1][lu.pm-1]}`]),
st("महीनों के नाम कैसे पड़े","How the months got their names",
`महीने का नाम इस बात से पड़ा कि उस महीने की पूर्णिमा को चंद्र किस नक्षत्र में रहता है। पूर्णिमा पर चंद्र सूर्य से ठीक सामने (180° दूर) होता है, इसलिए सूर्य की जगह से तय हो जाता है कि पूर्णिमा किस नक्षत्र में पड़ेगी। जैसे चैत्र में सूर्य मेष के आसपास होता है, तो सामने चंद्र तुला के पास चित्रा नक्षत्र में मिलता है: चित्रा → चैत्र। गणित का सीधा नियम (जो यह ऐप इस्तेमाल करता है): <b>अमावस्या के पल सूर्य जिस राशि में हो, उससे अमांत महीने का नाम तय होता है</b>: सूर्य मीन में हो तो चैत्र, मेष में हो तो वैशाख, और इसी तरह आगे।`+tbl(["महीना","पूर्णिमा का नक्षत्र","अमावस्या पर सूर्य की राशि","ऋतु"],MNT),
`A month is named after the nakshatra the Moon is in on that month's Purnima. At Purnima the Moon is directly opposite the Sun (180° away), so the Sun's place decides which nakshatra the Purnima will fall in. In Chaitra, for example, the Sun is around Mesh, so the Moon opposite it is near Chitra in Tula: Chitra → Chaitra. The direct maths rule (which this app uses): <b>the rashi the Sun is in at the moment of Amavasya decides the name of the amanta month</b>: Sun in Meen gives Chaitra, in Mesh gives Vaishakha, and so on.`+tbl(["Month","Purnima nakshatra","Sun's rashi at Amavasya","Ritu"],MNT)),
st("अधिक मास कैसे पहचानें","How to spot an adhik maas",
`12 चांद्र मास लगभग 354.4 दिन के होते हैं, जबकि सौर वर्ष लगभग 365.25 दिन का है। हर साल करीब 11 दिन का अंतर जमा होता है। इसे सुधारने के लिए लगभग हर 32-33 महीने में एक <b>अधिक मास</b> जोड़ा जाता है ताकि त्योहार अपनी ऋतु में बने रहें। पहचान का गणित: दो लगातार अमावस्याओं पर देखें कि सूर्य किस राशि में है। अगर दोनों बार सूर्य एक ही राशि में है (यानी बीच में संक्रांति नहीं पड़ी), तो वह चांद्र मास अधिक है, और उसका नाम अगले महीने वाला ही रहता है। (बहुत दुर्लभ उलटी स्थिति में एक चांद्र मास में दो संक्रांति पड़ सकती हैं, इसे क्षय मास कहते हैं।) 19 सौर वर्ष में लगभग 235 चांद्र मास आते हैं, जबकि 19 वर्ष के 12-12 महीने 228 होते हैं, इसलिए 19 साल में 7 अधिक मास जुड़ते हैं। उदाहरण: 2023 में अधिक श्रावण (18 जुलाई से 16 अगस्त)।`,
`12 lunar months make about 354.4 days while a solar year is about 365.25 days. A gap of about 11 days builds up every year. To fix this an <b>adhik maas</b> (extra month) is added roughly every 32-33 months so that festivals stay in their season. The maths of spotting it: on two successive Amavasyas look at the rashi the Sun is in. If it is the same rashi both times (no sankranti fell in between), that lunar month is adhik and it keeps the name of the month that follows. (In a very rare opposite case two sankrantis can fall in one lunar month; this is called a kshaya maas.) 19 solar years hold about 235 lunar months while 19 years of 12 months make 228, so 7 adhik months are added every 19 years. Example: Adhik Shravana in 2023 (18 July to 16 August).`,
[`${pd}: इस चांद्र मास में अधिक मास ${lu.adhik?'है':'नहीं है'}`,`${pd}: this lunar month ${lu.adhik?'is':'is not'} an adhik maas`]),
st("ऋतु, अयन और संक्रांति","Ritu, ayana and sankranti",
`<b>संक्रांति</b> वह पल है जब सूर्य एक राशि से अगली में जाता है। सूर्य को एक राशि में लगभग 30.4 दिन लगते हैं, इसे <b>सौर मास</b> कहते हैं। तमिलनाडु, केरल, बंगाल, ओडिशा और पंजाब जैसे क्षेत्रों के पंचांग मुख्यतः सौर मास पर चलते हैं। <b>ऋतु:</b> दो चांद्र महीनों की एक ऋतु: वसंत (चैत्र-वैशाख), ग्रीष्म (ज्येष्ठ-आषाढ़), वर्षा (श्रावण-भाद्रपद), शरद (आश्विन-कार्तिक), हेमंत (मार्गशीर्ष-पौष), शिशिर (माघ-फाल्गुन)। <b>अयन:</b> निरयन गणना में सूर्य मकर से मिथुन तक (मकर संक्रांति से कर्क संक्रांति तक) उत्तरायण में और कर्क से धनु तक दक्षिणायन में रहता है। <b>खिसकाव:</b> निरयन संक्रांति धीरे-धीरे आगे खिसकती है, क्योंकि पृथ्वी की धुरी के डोलने से वसंत बिंदु लगभग हर 72 साल में 1° पीछे खिसकता है (यानी 1 दिन)। इसलिए मकर संक्रांति, जो आज 14-15 जनवरी को पड़ती है, लाहिड़ी अयनांश के हिसाब से लगभग 285 ई. के आसपास शीत अयनांत (22 दिसंबर) के साथ पड़ती थी।`,
`<b>Sankranti</b> is the moment the Sun passes from one rashi to the next. The Sun takes about 30.4 days in one rashi; this is a <b>solar month</b>. The panchangs of regions such as Tamil Nadu, Kerala, Bengal, Odisha and Punjab mostly run on solar months. <b>Ritu:</b> one ritu is two lunar months: Vasanta (Chaitra-Vaishakha), Grishma (Jyeshtha-Ashadha), Varsha (Shravana-Bhadrapada), Sharad (Ashwin-Kartika), Hemanta (Margashirsha-Pausha), Shishira (Magha-Phalguna). <b>Ayana:</b> in the sidereal count the Sun is in Uttarayana from Makar to Mithun (Makar Sankranti to Karka Sankranti) and in Dakshinayana from Karka to Dhanu. <b>Drift:</b> sidereal sankrantis slowly move later, because the wobble of the Earth's axis shifts the spring point back by about 1° every 72 years (that is 1 day). So Makar Sankranti, which falls on 14-15 January today, coincided with the winter solstice (22 December) around 285 CE by the Lahiri ayanamsa.`,
[`${pd}: ऋतु ${RIT[0][lu.ritu]}, अयन ${AYN[0][lu.ayana]}, सूर्य ${RASHI[0][Math.floor(q.sun_lon/30)]} राशि में`,`${pd}: ritu ${RIT[1][lu.ritu]}, ayana ${AYN[1][lu.ayana]}, Sun in ${RASHI[1][Math.floor(q.sun_lon/30)]}`]),
st("संवत्: विक्रम, शक और कलि","Samvat: Vikram, Shaka and Kali",
`<b>विक्रम संवत्:</b> आरंभ 57 ई.पू.। परंपरा इसे उज्जैन के राजा विक्रमादित्य की शकों पर विजय से जोड़ती है। इतिहासकारों के अनुसार शुरुआती शिलालेखों में यह संवत् 'कृत' या 'मालव' नाम से मिलता है और 'विक्रम' नाम बाद की सदियों (लगभग 9वीं सदी के आसपास) के लेखों में आता है। <b>शक संवत्:</b> आरंभ 78 ई.। परंपरा इसे शक/कुषाण शासकों से जोड़ती है। 1957 में इसे भारत के राष्ट्रीय नागरिक कैलेंडर का आधार बनाया गया (चैत्र 1 = 22 मार्च, लीप वर्ष में 21 मार्च)। <b>कलि संवत्:</b> परंपरा में कलियुग का आरंभ 3102 ई.पू. (18 फरवरी) माना जाता है। आर्यभट ने आर्यभटीय में लिखा कि उनके समय कलियुग के 3600 वर्ष बीत चुके थे, जो 499 ई. बैठता है। तीनों वर्ष चैत्र शुक्ल प्रतिपदा से बदलते हैं (गुजरात में विक्रम संवत् कार्तिक शुक्ल प्रतिपदा से बदलता है)।`+tbl(["संवत्","आरंभ","सूत्र (चैत्र शुक्ल प्रतिपदा के बाद)","आपके दिन"],[["विक्रम","57 ई.पू.","ई. वर्ष + 57",lu.vs],["शक","78 ई.","ई. वर्ष − 78",lu.shaka],["कलि","3102 ई.पू.","ई. वर्ष + 3101",lu.kali]])+`चैत्र शुक्ल प्रतिपदा से पहले (जनवरी से मार्च के बीच) हर सूत्र में एक वर्ष और जोड़ें/घटाएँ ताकि वह सही निकले (विक्रम: +56, शक: −79, कलि: +3102)।`,
`<b>Vikram Samvat:</b> begins in 57 BCE. Tradition links it to King Vikramaditya of Ujjain defeating the Shakas. Historians note that early inscriptions give this era the name 'Krita' or 'Malava', and the name 'Vikrama' appears in records of later centuries (around the 9th century). <b>Shaka Samvat:</b> begins in 78 CE. Tradition links it to the Shaka/Kushana rulers. In 1957 it was made the basis of India's national civil calendar (Chaitra 1 = 22 March, 21 March in a leap year). <b>Kali Samvat:</b> tradition places the start of Kali Yuga at 3102 BCE (18 February). Aryabhata wrote in the Aryabhatiya that 3600 years of Kali Yuga had passed in his time, which works out to 499 CE. All three years change at Chaitra Shukla Pratipada (in Gujarat Vikram Samvat changes at Kartika Shukla Pratipada).`+tbl(["Samvat","Starts","Formula (after Chaitra Shukla Pratipada)","Your day"],[["Vikram","57 BCE","CE year + 57",lu.vs],["Shaka","78 CE","CE year − 78",lu.shaka],["Kali","3102 BCE","CE year + 3101",lu.kali]])+`Before Chaitra Shukla Pratipada (between January and March) shift each formula by one year so it comes out right (Vikram: +56, Shaka: −79, Kali: +3102).`),
st("पारंपरिक गणित और यह ऐप","Traditional maths versus this app",
`पारंपरिक सिद्धांत-ग्रंथों (जैसे सूर्य सिद्धांत) में किसी युगादि से बीते दिनों की गिनती (अहर्गण) निकालकर माध्य गतियों से ग्रह निकाले जाते थे। यह ऐप आधुनिक एफेमेरिस (Swiss Ephemeris) से ग्रहों की वास्तविक स्थिति निकालता है और लाहिड़ी अयनांश लेता है। छपे हुए पंचांग कभी 'दृक्' (आधुनिक, प्रत्यक्ष गणना) और कभी 'सूर्य सिद्धांत' या 'वाक्य' जैसी पद्धतियों पर बने होते हैं; अयनांश भी अलग हो सकता है, और सूर्योदय की परिभाषा तथा स्थान भी। इसलिए ऐप और आपके छपे पंचांग में तिथि या नक्षत्र के समाप्ति-समय में कुछ मिनट (कभी ज़्यादा) का फर्क दिख सकता है। यह गलती नहीं, पद्धति का फर्क है।`,
`Traditional siddhanta texts (such as the Surya Siddhanta) worked out the count of days elapsed since a yugadi epoch (the ahargana) and found the grah from mean motions. This app takes the true positions of the grah from a modern ephemeris (Swiss Ephemeris) and uses the Lahiri ayanamsa. Printed panchangs are sometimes built on 'drik' (modern, observational calculation) and sometimes on methods such as the 'Surya Siddhanta' or 'vakya'; the ayanamsa may differ, and so may the definition of sunrise and the place. So the end times of a tithi or nakshatra may differ by a few minutes (sometimes more) between this app and your printed panchang. This is not an error, it is a difference of method.`)]},

st("मुहूर्त क्या है?","What is a muhurat?",
`<b>मुहूर्त</b> शब्द के दो अर्थ हैं। <b>(1) समय की इकाई:</b> 1 मुहूर्त = 48 मिनट (दिन-रात में 30 मुहूर्त)। <b>(2) चुना हुआ समय:</b> किसी काम (विवाह, गृह प्रवेश, यात्रा आदि) के लिए पंचांग के हिसाब से चुना गया समय। गणित वाला हिस्सा यह है कि दिन-रात को हिस्सों में कैसे बाँटा जाता है और हर हिस्से का नाम क्या है। 'कौन सा समय किस काम के लिए अच्छा माना जाता है', यह फलित है और बाद में आएगा। इस ऐप में हम सिर्फ समय-खाने निकालते हैं: अभिजित, चौघड़िया, होरा, राहुकाल, यमगंड, गुलिक।`,
`<b>Muhurat</b> has two meanings. <b>(1) A unit of time:</b> 1 muhurta = 48 minutes (30 in a day and night). <b>(2) A chosen time:</b> a time picked from the panchang for some work (marriage, housewarming, travel etc.). The maths part is how the day and night are divided into slots and what each slot is called. "Which slot is considered good for which work" is falit and comes later. In this app we only work out the time slots: Abhijit, Choghadiya, Hora, Rahu Kaal, Yamaganda, Gulika.`),
st("मौसम से बदलती दिन की लंबाई","Day length changes with the season",
`घड़ी का घंटा हमेशा 60 मिनट का है, पर मुहूर्त के हिस्से दिन की असली लंबाई पर टिके हैं। गर्मी में दिन लंबा और सर्दी में छोटा होता है, इसलिए हिस्से भी लंबे-छोटे हो जाते हैं। दिल्ली में दिन लगभग 10 घंटे 20 मिनट (दिसंबर) से 13 घंटे 55 मिनट (जून) तक बदलता है। इसीलिए 'होरा = 1 घंटा' सिर्फ औसत है; असल में दिन की होरा लगभग 52 से 70 मिनट की हो सकती है। रात की होरा इसका उल्टा होगा।`,
`A clock hour is always 60 minutes, but muhurat slots depend on the real length of the day. Days are long in summer and short in winter, so the slots stretch and shrink too. In Delhi the day changes from about 10 h 20 min (December) to 13 h 55 min (June). So "hora = 1 hour" is only an average; a day hora can really be about 52 to 70 minutes. Night horas do the opposite.`,
[`${pd}: दिनमान ${hm(mu.dinman)} → दिन की हर होरा = ${hm(mu.dinman)} ÷ 12 = ${hm(Math.round(mu.dinman/12))}`,`${pd}: day length ${hm(mu.dinman)} → each day hora = ${hm(mu.dinman)} ÷ 12 = ${hm(Math.round(mu.dinman/12))}`]),
...S3]},
{t:["गोचर","Gochar (transit)"],s:[
st("गोचर क्या है (गणित वाला हिस्सा)","What is gochar (the maths part)",
`ग्रह चलते रहते हैं। कुंडली जन्म के पल की तस्वीर है, और <b>गोचर</b> किसी और पल (जैसे आज) की तस्वीर है। गणित वही है जो कुंडली में था: उस तारीख-समय का JD, ग्रहों की निरयन स्थिति, फिर राशि-अंश-नक्षत्र। फर्क बस इतना कि यहाँ लग्न की ज़रूरत नहीं पड़ती। नीचे तालिका में हर ग्रह को एक राशि में औसतन लगभग कितना समय लगता है:`+tbl(["ग्रह","एक राशि में लगभग"],[[GN[0][1],"2.3 दिन"],[GN[0][0],"1 महीना"],[GN[0][3]+" / "+GN[0][5],"लगभग 1 महीना (बदलता है)"],[GN[0][2],"1.5 से 2 महीने"],[GN[0][4],"लगभग 1 साल"],[GN[0][6],"लगभग 2.5 साल"],[GN[0][7]+" / "+GN[0][8],"लगभग 1.5 साल (उल्टे)"]]),
`Grah keep moving. A kundali is the picture of the birth moment, and <b>gochar</b> is the picture of some other moment (such as today). The maths is the same as for the kundali: the JD of that date and time, the sidereal positions of the grah, then rashi-degree-nakshatra. The only difference is that no lagna is needed here. The table gives roughly how long each grah stays in one rashi on average:`+tbl(["Grah","Time in one rashi"],[[GN[1][1],"2.3 days"],[GN[1][0],"1 month"],[GN[1][3]+" / "+GN[1][5],"about 1 month (varies)"],[GN[1][2],"1.5 to 2 months"],[GN[1][4],"about 1 year"],[GN[1][6],"about 2.5 years"],[GN[1][7]+" / "+GN[1][8],"about 1.5 years (backwards)"]])),
st("गोचर में भाव गिनना: लग्न से और चंद्र से","Counting houses in gochar: from lagna and from the Moon",
`गोचर के ग्रह की जगह को अपनी कुंडली से जोड़ने के लिए भाव गिना जाता है। गिनती वही है जो भाव वाले अध्याय में थी (शुरू का भाव भी गिना जाता है)। गिनती के दो आम आधार हैं: <b>लग्न से</b> (जन्म-लग्न को भाव 1 मानकर) और <b>चंद्र से</b> (जन्म की चंद्र राशि को भाव 1 मानकर)। सूत्र: भाव = (गोचर ग्रह की राशि − आधार राशि) को 12 से घुमाकर + 1।<br>(किस भाव में किस ग्रह के गोचर का क्या फल माना जाता है, यह फलित है। यहाँ सिर्फ गिनती है।)`,
`To tie a transiting grah's place to your own kundali we count houses. The counting is the same as in the bhav chapter (the starting house is counted too). There are two common bases: <b>from the lagna</b> (taking the birth lagna as house 1) and <b>from the Moon</b> (taking the birth Moon rashi as house 1). Formula: house = (transiting grah's rashi − base rashi, wrapped around 12) + 1.<br>(What a grah's gochar in which house is believed to bring is falit. Here is only the counting.)`,
[`${pd}: ${GN[0][6]} ${RASHI[0][Math.floor(tr[6].lon/30)]} में। लग्न (${RASHI[0][lag]}) से भाव ${info(tr[6].lon,lag).h}; जन्म-चंद्र (${RASHI[0][mi.r]}) से भाव ${((Math.floor(tr[6].lon/30)-mi.r+12)%12)+1}`,`${pd}: ${GN[1][6]} in ${RASHI[1][Math.floor(tr[6].lon/30)]}. House ${info(tr[6].lon,lag).h} from lagna (${RASHI[1][lag]}); house ${((Math.floor(tr[6].lon/30)-mi.r+12)%12)+1} from the birth Moon (${RASHI[1][mi.r]})`]),
st("ऐप में गोचर","Gochar in the app",
`'गोचर' टैब में तारीख और समय चुनें (शुरू में आज का समय आता है) और जगह/टाइम ज़ोन ऊपर के खानों में रखें। अगर आपने कुंडली बना रखी है तो तालिका में 'लग्न से भाव' और 'चंद्र से भाव' के कॉलम और आपके लग्न पर बना गोचर चार्ट भी दिखेगा।`,
`In the 'Gochar' tab pick a date and time (it starts with the present time) and keep the place/time zone in the boxes above. If you have made a kundali, the table also shows 'House from lagna' and 'House from Moon' columns, along with a gochar chart drawn on your lagna.`)]},
{t:["वर्ग चार्ट: नवांश, दशांश","Varga charts: Navamsa, Dashamsa"],s:[
st("वर्ग चार्ट क्या हैं?","What are varga charts?",
`हर राशि (30°) को और छोटे बराबर हिस्सों में बाँटा जा सकता है, और हर हिस्से को एक राशि दे दी जाती है। इस तरह ग्रह की एक नई राशि बनती है, और सबकी नई राशियों से एक नया चार्ट बनता है जिसे कुंडली की तरह ही बनाया जाता है। इसे वर्ग (विभागीय) चार्ट कहते हैं। नाम में D के आगे की संख्या बताती है कि राशि कितने हिस्सों में बँटी।`+tbl(["चार्ट","हिस्से","हर हिस्से का नाप"],[["D1 राशि","1","30°"],["D9 नवांश","9","3°20'"],["D10 दशांश","10","3°"]])+`हर वर्ग चार्ट का अपना नियम है कि कौन सा हिस्सा किस राशि को मिले। (किस चार्ट से जीवन का कौन सा पहलू देखा जाता है, यह फलित है।)`,
`Each rashi (30°) can be split into smaller equal parts, and each part is given a rashi. This gives every grah a new rashi, and the new rashis make a new chart drawn just like a kundali. It is called a varga (divisional) chart. The number after D says into how many parts the rashi was split.`+tbl(["Chart","Parts","Size of each part"],[["D1 Rashi","1","30°"],["D9 Navamsa","9","3°20'"],["D10 Dashamsa","10","3°"]])+`Every varga chart has its own rule for which part gets which rashi. (Which area of life each chart is used to look at is falit.)`),
st("नवांश (D9) की गिनती","Navamsa (D9) calculation",
`राशि को 9 हिस्सों में बाँटने पर हर हिस्सा 3°20' का होता है, यानी ठीक एक नक्षत्र-पद। पूरे राशि चक्र में 108 पद हैं। मेष 0° से गिनते हुए पद 1 को मेष, पद 2 को वृषभ, ... पद 12 को मीन, पद 13 को फिर मेष मिलती है, और यह क्रम 108 तक चलता है। इसलिए: <b>पद संख्या ÷ 12 का शेष = नवांश की राशि</b> (शेष 0 = मेष)। परंपरा का नियम भी इसी के बराबर है: चर राशियाँ अपनी ही राशि से, स्थिर राशियाँ अपनी 9वीं राशि से, द्विस्वभाव राशियाँ अपनी 5वीं राशि से नवांश शुरू करती हैं। तालिका में हर राशि का पहला नवांश है:`+tbl(["राशि","पहला नवांश"],[...Array(12)].map((_,k)=>[RASHI[0][k],RASHI[0][(k*9)%12]])),
`Splitting a rashi into 9 parts makes each part 3°20', exactly one nakshatra pada. The whole zodiac has 108 padas. Counting from Mesh 0°, pada 1 gets Mesh, pada 2 Vrishabh, ... pada 12 Meen, pada 13 Mesh again, and this runs on to 108. So: <b>pada number ÷ 12, remainder = navamsa rashi</b> (remainder 0 = Mesh). The traditional rule gives the same result: movable rashis start their navamsa from their own rashi, fixed rashis from their 9th rashi, dual rashis from their 5th rashi. The table shows the first navamsa of every rashi:`+tbl(["Rashi","First navamsa"],[...Array(12)].map((_,k)=>[RASHI[1][k],RASHI[1][(k*9)%12]])),
[`${GN[0][0]} ${f(sun.lon)}° ÷ 3°20' → ${Math.floor(sun.lon/(10/3)+1e-9)} पूरे पद बीते → ${Math.floor(sun.lon/(10/3)+1e-9)} ÷ 12 का शेष ${Math.floor(sun.lon/(10/3)+1e-9)%12} → नवांश ${RASHI[0][Math.floor(sun.lon/(10/3)+1e-9)%12]}`,`${GN[1][0]} ${f(sun.lon)}° ÷ 3°20' → ${Math.floor(sun.lon/(10/3)+1e-9)} full padas passed → ${Math.floor(sun.lon/(10/3)+1e-9)} ÷ 12 remainder ${Math.floor(sun.lon/(10/3)+1e-9)%12} → navamsa ${RASHI[1][Math.floor(sun.lon/(10/3)+1e-9)%12]}`]),
st("दशांश (D10) की गिनती","Dashamsa (D10) calculation",
`राशि के 30° को 10 हिस्सों में बाँटते हैं, हर हिस्सा 3° का। हिस्सा संख्या p = राशि के भीतर का अंश ÷ 3 का पूर्णांक (0 से 9)। नियम: <b>विषम राशियाँ</b> (मेष, मिथुन, सिंह, तुला, धनु, कुंभ) अपनी ही राशि से गिनना शुरू करती हैं। <b>सम राशियाँ</b> (वृषभ, कर्क, कन्या, वृश्चिक, मकर, मीन) अपनी 9वीं राशि से। दशांश राशि = (शुरुआती राशि + p) को 12 से घुमाकर।`,
`The 30° of a rashi is split into 10 parts of 3° each. Part number p = the degree inside the rashi ÷ 3, whole part (0 to 9). Rule: <b>odd rashis</b> (Mesh, Mithun, Singh, Tula, Dhanu, Kumbh) start counting from their own rashi. <b>Even rashis</b> (Vrishabh, Kark, Kanya, Vrishchik, Makar, Meen) start from their 9th rashi. Dashamsa rashi = (starting rashi + p), wrapped around 12.`,
[`${GN[0][0]}: ${RASHI[0][si.r]} ${dm(si.d)} → p = ${Math.floor(si.d/3+1e-9)}; ${si.r%2==0?'विषम':'सम'} राशि, शुरुआत ${RASHI[0][si.r%2==0?si.r:(si.r+8)%12]} → दशांश ${RASHI[0][vsign(sun.lon,10)]}`,`${GN[1][0]}: ${RASHI[1][si.r]} ${dm(si.d)} → p = ${Math.floor(si.d/3+1e-9)}; ${si.r%2==0?'odd':'even'} rashi, start ${RASHI[1][si.r%2==0?si.r:(si.r+8)%12]} → dashamsa ${RASHI[1][vsign(sun.lon,10)]}`]),
st("ऐप में वर्ग चार्ट","Varga charts in the app",
`कुंडली टैब में चार्ट के नीचे 'वर्ग चार्ट' का खाना है। वहाँ D1, D9 और D10 के बटन हैं। चुने हुए चार्ट का उत्तर भारतीय चार्ट और हर ग्रह की उस वर्ग में राशि दिखती है। लग्न को भी उसी नियम से बदला जाता है। (D9 में 'लग्न' का मतलब लग्न बिंदु का नवांश है।)`,
`In the Kundali tab there is a 'Varga charts' box below the charts, with buttons for D1, D9 and D10. It shows the North Indian chart of the chosen varga and each grah's rashi in it. The lagna is converted by the same rule. (The 'lagna' of D9 means the navamsa of the lagna point.)`)]},
{t:["कुंडली मिलान का गणित","Kundali Milan maths"],s:[
st("मिलान क्या है और क्या चाहिए","What is Milan and what does it need",
`अष्टकूट मिलान दो लोगों के <b>चंद्र की राशि और नक्षत्र</b> से बनता है, बाकी कुंडली से नहीं। आठ कूट हैं और उनके अधिकतम अंक 1, 2, 3, 4, 5, 6, 7, 8 हैं, जिनका जोड़ 36 है। परंपरा में एक को वर और दूसरे को वधू मानकर गिनती की जाती है, क्योंकि कई कूट दिशा पर निर्भर हैं।`+tbl(["कूट","अंक","किससे निकलता है"],[["वर्ण","1","चंद्र राशि"],["वश्य","2","चंद्र राशि"],["तारा","3","चंद्र नक्षत्र (गिनती, 9 का शेष)"],["योनि","4","चंद्र नक्षत्र"],["ग्रह मैत्री","5","चंद्र राशि का स्वामी"],["गण","6","चंद्र नक्षत्र"],["भकूट","7","दोनों चंद्र राशियों की दूरी"],["नाड़ी","8","चंद्र नक्षत्र"]]),
`Ashtakoot matching is built only from the <b>Moon's rashi and nakshatra</b> of the two people, not from the rest of the kundali. There are eight koots with maximum points 1, 2, 3, 4, 5, 6, 7, 8, which add up to 36. By tradition one person is taken as the groom and the other as the bride, because several koots depend on direction.`+tbl(["Koot","Points","Comes from"],[["Varna","1","Moon rashi"],["Vashya","2","Moon rashi"],["Tara","3","Moon nakshatra (count, remainder of 9)"],["Yoni","4","Moon nakshatra"],["Graha maitri","5","Lord of the Moon rashi"],["Gana","6","Moon nakshatra"],["Bhakoot","7","Distance between the two Moon rashis"],["Nadi","8","Moon nakshatra"]])),
st("नक्षत्र से गण, नाड़ी और योनि","Gana, nadi and yoni from the nakshatra",
`हर नक्षत्र को एक गण (देव, मनुष्य, राक्षस), एक नाड़ी (आदि, मध्य, अंत्य) और एक योनि (पशु-प्रतीक) दी गई है। नाड़ी का क्रम एक ज़िगज़ैग है: पहले 9 नक्षत्रों में आदि, मध्य, अंत्य, अंत्य, मध्य, आदि, आदि, मध्य, अंत्य; बीच के 9 में यही उलटा; अंतिम 9 में फिर पहले जैसा। नीचे पूरी तालिका है (योनि वाला कॉलम कुछ स्रोतों से मेल खाता है, कुछ मेरी याद पर है: जाँचें)।`+`<details><summary style="cursor:pointer">27</summary>${tbl(["#","नक्षत्र","गण","नाड़ी","योनि"],[...Array(27)].map((_,n)=>[n+1,NK[0][n],GANN[0][GANA[n]],NADN[0][nadiIdx(n)],YON[0][YMAP[n]]]))}</details>`,
`Every nakshatra is given a gana (Deva, Manushya, Rakshasa), a nadi (Adi, Madhya, Antya) and a yoni (an animal symbol). The nadi order is a zigzag: in the first 9 nakshatras Adi, Madhya, Antya, Antya, Madhya, Adi, Adi, Madhya, Antya; in the middle 9 the same reversed; in the last 9 as at first. The full table is below (the yoni column matches some sources and partly rests on my memory: verify).`+`<details><summary style="cursor:pointer">27</summary>${tbl(["#","Nakshatra","Gana","Nadi","Yoni"],[...Array(27)].map((_,n)=>[n+1,NK[1][n],GANN[1][GANA[n]],NADN[1][nadiIdx(n)],YON[1][YMAP[n]]]))}</details>`),
st("पाँच कूटों की गिनती","Counting the five koots",
`<b>वर्ण (1):</b> राशि से वर्ण: मीन, कर्क, वृश्चिक = ब्राह्मण; मेष, सिंह, धनु = क्षत्रिय; वृषभ, कन्या, मकर = वैश्य; मिथुन, तुला, कुंभ = शूद्र। वर का वर्ण वधू के बराबर या ऊँचा हो तो 1, नहीं तो 0।<br><b>तारा (3):</b> वधू के नक्षत्र से वर के नक्षत्र तक गिनें (शुरू वाला भी गिना जाता है), 9 से भाग देकर शेष देखें (0 हो तो 9)। शेष 3, 5, 7 अशुभ गिने जाते हैं। फिर वर से वधू की ओर भी यही। दोनों ठीक तो 3, एक ठीक तो 1.5, दोनों नहीं तो 0।<br><b>ग्रह मैत्री (5):</b> दोनों राशियों के स्वामी ग्रह देखें और हर एक की दूसरे के प्रति नैसर्गिक मित्रता (मित्र/सम/शत्रु)। स्वामी एक ही या दोनों मित्र: 5; मित्र+सम: 4; सम+सम: 3; मित्र+शत्रु: 1; सम+शत्रु: 0.5; शत्रु+शत्रु: 0।<br><b>भकूट (7):</b> वधू की राशि से वर की राशि तक गिनें। दूरी 2/12, 5/9 या 6/8 हो तो 0, वरना 7।<br><b>नाड़ी (8):</b> दोनों की नाड़ी अलग हो तो 8, एक ही हो तो 0।`,
`<b>Varna (1):</b> rashi to varna: Meen, Kark, Vrishchik = Brahmin; Mesh, Singh, Dhanu = Kshatriya; Vrishabh, Kanya, Makar = Vaishya; Mithun, Tula, Kumbh = Shudra. If the groom's varna is equal to or higher than the bride's, 1; else 0.<br><b>Tara (3):</b> count from the bride's nakshatra to the groom's (the starting one is counted too), divide by 9 and take the remainder (9 if 0). Remainders 3, 5, 7 are counted as unfavourable. Then do the same from groom to bride. Both fine: 3; one fine: 1.5; neither: 0.<br><b>Graha maitri (5):</b> take the lords of the two rashis and each one's natural friendship (friend/neutral/enemy) toward the other. Same lord or both friends: 5; friend+neutral: 4; neutral+neutral: 3; friend+enemy: 1; neutral+enemy: 0.5; enemy+enemy: 0.<br><b>Bhakoot (7):</b> count from the bride's rashi to the groom's. If the distance is 2/12, 5/9 or 6/8: 0, else 7.<br><b>Nadi (8):</b> different nadis: 8; the same nadi: 0.`,
[`उदाहरण (आपका चंद्र = वर, चुने हुए दिन का चंद्र = वधू मानकर): वर्ण ${VARN[0][mc.varna.g]}/${VARN[0][mc.varna.b]} → ${mc.varna.s}; तारा ${mc.tara.x.c}(शेष ${mc.tara.x.r}) और ${mc.tara.y.c}(शेष ${mc.tara.y.r}) → ${mc.tara.s}; ग्रह मैत्री ${GN[0][mc.mait.la]}/${GN[0][mc.mait.lb]} → ${mc.mait.s}; भकूट दूरी ${mc.bhak.d} → ${mc.bhak.s}; नाड़ी ${NADN[0][mc.nadi.g]}/${NADN[0][mc.nadi.b]} → ${mc.nadi.s}; जोड़ ${mc.total}/24`,`Example (your Moon = groom, the Moon of the chosen day = bride): varna ${VARN[1][mc.varna.g]}/${VARN[1][mc.varna.b]} → ${mc.varna.s}; tara ${mc.tara.x.c}(rem. ${mc.tara.x.r}) and ${mc.tara.y.c}(rem. ${mc.tara.y.r}) → ${mc.tara.s}; graha maitri ${GN[1][mc.mait.la]}/${GN[1][mc.mait.lb]} → ${mc.mait.s}; bhakoot distance ${mc.bhak.d} → ${mc.bhak.s}; nadi ${NADN[1][mc.nadi.g]}/${NADN[1][mc.nadi.b]} → ${mc.nadi.s}; total ${mc.total}/24`]),
st("तालिकाओं में फर्क: हम सावधान क्यों हैं","Differences between tables: why we are careful",
`आपने शुरू में कहा था कि नियम कभी एक-दूसरे का साथ देते हैं और कभी टकराते हैं। मिलान में यह साफ दिखता है। मैंने अलग-अलग स्रोत देखे तो: <b>वश्य</b> की अंक-तालिकाएँ अलग-अलग मिलीं (कहीं चार वर्ग, कहीं पाँच, और अंक भी अलग); <b>योनि</b> में एक स्रोत 14×14 मित्र-शत्रु तालिका देता है और दूसरा सिर्फ 'एक ही योनि, नर-मादा का भेद और सात शत्रु जोड़ियाँ' पर चलता है; <b>गण</b> की असमान जोड़ियों के अंक स्रोत पर निर्भर हैं; और <b>तारा</b> में कुछ स्रोत जन्म-तारा को अंक देते हैं, कुछ नहीं। सात शत्रु योनि-जोड़ियाँ प्रायः ये मानी जाती हैं: गाय-बाघ, हाथी-सिंह, घोड़ा-भैंस, कुत्ता-हिरण, सर्प-नेवला, बंदर-भेड़, बिल्ली-चूहा। इसलिए ऐप सिर्फ वही पाँच कूट अंकित करता है जिनके नियम सुसंगत मिले (कुल 24 अंक); बाकी की श्रेणी दिखाता है, अंक नहीं। अगर आप किसी खास ग्रंथ या गुरु की तालिका को आधार बनाना चाहें तो वह भेज दें, तब उसी के अनुसार ऐप में जोड़ा जा सकता है। मिलान एक परंपरागत अंक-प्रणाली है; इससे जीवन के बड़े फैसले अकेले नहीं किए जाने चाहिए।`,
`You said at the start that rules sometimes support and sometimes contradict one another. Milan shows this clearly. In the sources I looked at: the scoring tables for <b>Vashya</b> differ (four groups in some, five in others, and different points); for <b>Yoni</b> one source gives a 14×14 friend-enemy table and another works only on 'same yoni, male-female difference and seven enemy pairs'; the points for unequal <b>Gana</b> pairs depend on the source; and for <b>Tara</b> some sources give points for the birth star and some do not. The seven enemy yoni pairs are usually taken as: cow-tiger, elephant-lion, horse-buffalo, dog-deer, serpent-mongoose, monkey-sheep, cat-rat. So the app scores only the five koots whose rules were consistent (24 points in all); for the rest it shows the category, not a score. If you want to base it on a particular text or a teacher's table, send it and it can be added accordingly. Milan is a traditional point system; big life decisions should not be made on it alone.`)]},

{t:["ग्रंथ और आगे की पढ़ाई","Books and further study"],s:[
st("शास्त्र कैसे पढ़ें: सुझाव","How to study the shastra: suggestions",
`इस ऐप में आपने गणित सीखा। मूल शास्त्र पढ़ने के लिए ये आधार काम आते हैं: (1) देवनागरी और संस्कृत की प्रारंभिक समझ, (2) गणित वाले भाग का अभ्यास (जो आप कर चुके हैं), (3) एक अनुभवी गुरु या विद्यालय का मार्गदर्शन। मूल ग्रंथों में श्लोक छोटे और संकेतात्मक होते हैं; टीका (टिप्पणी) के बिना अर्थ में चूक हो सकती है, इसलिए हमेशा किसी मान्य टीका के साथ पढ़ें। यह भी ध्यान रखें कि एक ही ग्रंथ के अलग संस्करणों में पाठ भेद होते हैं।`,
`In this app you learnt the maths. To read the original shastra these foundations help: (1) a basic grasp of Devanagari and Sanskrit, (2) practice with the maths part (which you have done), (3) the guidance of an experienced teacher or school. Verses in the original texts are short and cryptic; without a commentary the meaning can go wrong, so always read with a recognised commentary. Also remember that different editions of the same text have variant readings.`),
st("ग्रंथों की सूची","List of texts",
`नीचे की सूची में जिन बातों के आगे (जाँचें) लिखा है, वे मेरी याद पर आधारित हैं, इसलिए खरीदने या पढ़ने से पहले प्रकाशक/संस्करण खुद पक्का कर लें।`+tbl(["ग्रंथ","क्या है","कहाँ/कैसे"],BK.map(x=>[x[0],x[1],x[3]])),
`Items marked (verify) in the list below are from my memory, so please confirm the publisher/edition yourself before buying or reading.`+tbl(["Text","What it is","Where/how"],BK.map(x=>[x[0],x[2],x[4]]))),
st("पढ़ाई कहाँ करें","Where to study",
`वाराणसी के संपूर्णानंद संस्कृत विश्वविद्यालय (पहले गवर्नमेंट संस्कृत कॉलेज, बनारस) में ज्योतिष की परंपरागत पढ़ाई होती है। मेरी जानकारी के अनुसार काशी हिंदू विश्वविद्यालय (BHU) और हरिद्वार के उत्तराखंड संस्कृत विश्वविद्यालय में भी ज्योतिष के पाठ्यक्रम हैं (जाँचें)। पाठ्यक्रम, योग्यता और प्रवेश की जानकारी उनकी आधिकारिक वेबसाइट से लें। इसके अलावा गुरु-शिष्य परंपरा में किसी विद्वान से सीखना भी रास्ता है। मैं किताबें खुद भेज नहीं सकता (कॉपीराइट), पर ऊपर की सूची में जो स्रोत सार्वजनिक या कानूनी रूप से उपलब्ध हैं, उनके नाम दिए हैं।`,
`The Sampurnanand Sanskrit University in Varanasi (formerly the Government Sanskrit College, Banaras) offers traditional Jyotish study. As far as I know Banaras Hindu University (BHU) and Uttarakhand Sanskrit University in Haridwar also have Jyotish courses (verify). Take the syllabus, eligibility and admission details from their official websites. Learning from a scholar in the guru-shishya tradition is another route. I cannot send books myself (copyright), but the list above names the sources that are publicly or legally available.`)]}];

const tabs=`<div style="display:flex;gap:6px;margin-bottom:12px"><button data-lt="g" class="${lt=='g'?'p':''}" style="flex:1">${t('tg')}</button><button data-lt="f" class="${lt=='f'?'p':''}" style="flex:1">${t('tf')}</button></div>`;
if(lt=='f'){$('learn').innerHTML=tabs+`<div class="card">${t('fl')}</div>`;bindTabs();return}
const chips=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${CH.map((c,k)=>`<button data-lc="${k}" class="${k==lc?'p':''}">${k}. ${c.t[I]}</button>`).join('')}</div>`;
const cur=CH[lc];
$('learn').innerHTML=tabs+chips+`<p class="mut">${note}</p>`+cur.s.map((s,k)=>`<div class="step"><h3>${lc}.${k+1} ${s[0][I]}</h3>${s[1][I]}${s[3]?`<div style="max-width:420px;margin:8px auto">${s[3]}</div>`:''}${s[2]?`<div class="ex">${s[2][I]}</div>`:''}</div>`).join('')+`<div style="display:flex;gap:8px"><button ${lc==0?'disabled':''} data-lc="${lc-1}" style="flex:1">◀</button><button ${lc==CH.length-1?'disabled':''} data-lc="${lc+1}" style="flex:1">▶</button></div>`;bindTabs()}
function bindTabs(){document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{lt=b.dataset.lt;showLearn()});document.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{lc=+b.dataset.lc;showLearn();window.scrollTo(0,0)})}
if('serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
applyLang();
