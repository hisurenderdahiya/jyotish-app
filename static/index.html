{t:["वर्ष का कैलेंडर","The year calendar"],s:[
st("कैलेंडर में क्या-क्या निकलता है","What a year calendar contains",
`साल का कैलेंडर पूरी तरह गणित से बनता है। इसमें ये चीज़ें निकलती हैं: <b>अमावस्या और पूर्णिमा</b> के सटीक पल, <b>संक्रांतियाँ</b> (सूर्य का एक राशि से अगली में जाना), <b>एकादशी</b> की तारीखें और <b>ग्रहण</b>। इन चारों का आधार वही है जो आप पहले सीख चुके हैं: चंद्र-सूर्य का कोण (तिथि), सूर्य के निरयन अंश (संक्रांति), और चंद्र-सूर्य और राहु-केतु की स्थिति (ग्रहण)। इस अध्याय में इन्हें ढूँढ़ने के तरीके हैं; किस तिथि या पर्व का क्या महत्त्व माना जाता है, यह फलित/परंपरा का विषय है।`,
`A year calendar is built entirely by maths. It contains: the exact moments of <b>Amavasya and Purnima</b>, the <b>Sankrantis</b> (the Sun passing from one rashi to the next), the dates of <b>Ekadashi</b> and the <b>eclipses</b>. All four rest on what you have already learnt: the Moon-Sun angle (tithi), the Sun's sidereal degree (sankranti), and the Moon, Sun and Rahu-Ketu positions (eclipses). This chapter gives the methods for finding them; the importance attached to a tithi or festival belongs to falit/tradition.`),
st("अमावस्या और पूर्णिमा का सही पल कैसे ढूँढ़ें","How to find the exact moment of Amavasya and Purnima",
`चंद्र-सूर्य का कोण E(t) हर पल बदलता है। जब E = 0° हो तो अमावस्या, जब E = 180° हो तो पूर्णिमा। चंद्र सूर्य से रोज़ लगभग 12.19° आगे निकलता है, इसलिए एक अमावस्या से अगली तक औसतन 360 ÷ 12.19 ≈ 29.53 दिन। सही पल ढूँढ़ने की विधि: (1) पिछले पल में 29.53 दिन जोड़कर मोटा अनुमान लें। (2) उस समय E निकालें और देखें लक्ष्य से कितना दूर है। (3) अंतर ÷ 12.19 दिन से समय सुधारें। (4) यही दोहराएँ या दो समयों के बीच बार-बार आधा करते जाएँ (द्विभाजन) जब तक अंतर नगण्य न रह जाए। चंद्र की चाल बदलती रहती है (11° से 15° प्रतिदिन), इसलिए औसत सिर्फ शुरुआती अनुमान के लिए है; असली पल गणना से ही मिलता है।`,
`The Moon-Sun angle E(t) changes every moment. When E = 0° it is Amavasya and when E = 180° it is Purnima. The Moon gains about 12.19° a day on the Sun, so from one Amavasya to the next is on average 360 ÷ 12.19 ≈ 29.53 days. The method to find the exact moment: (1) add 29.53 days to the previous moment for a rough guess. (2) Work out E at that time and see how far it is from the target. (3) Correct the time by difference ÷ 12.19 days. (4) Repeat this, or keep halving the gap between two times (bisection), until the difference is negligible. The Moon's speed keeps changing (11° to 15° a day), so the average is only for the first guess; the real moment comes only from calculation.`,
[`${pn.inp.y} की पहली पूर्णिमा: ${dtf(yc.lunations[0].full)} (उस पल चंद्र ${NK[0][yc.lunations[0].nak]} नक्षत्र में)। इसी साल की अमावस्याओं और पूर्णिमाओं की गिनती: ${yc.lunations.length} चांद्र मास।`,`First Purnima of ${pn.inp.y}: ${dtf(yc.lunations[0].full)} (the Moon is then in ${NK[1][yc.lunations[0].nak]}). Lunar months listed for this year: ${yc.lunations.length}.`]),
st("संक्रांति का पल","The moment of a sankranti",
`वही तरीका सूर्य पर लगाइए: सूर्य के निरयन अंश S(t) को हर दिन जाँचें। जिस दिन राशि-संख्या (S ÷ 30 का पूर्णांक) बदल जाए, उसी दिन के भीतर संक्रांति है। फिर उस दिन के भीतर द्विभाजन से सटीक पल निकालें (जब S ठीक 30° का गुणज हो)। सूर्य का औसत वेग लगभग 0.9856° प्रतिदिन है, इसलिए दो संक्रांतियों के बीच लगभग 30.4 दिन होते हैं। मकर संक्रांति वह पल है जब सूर्य मकर राशि (270°) में प्रवेश करता है। (संक्रांति के पुण्यकाल आदि की परंपराएँ अलग-अलग हैं और यहाँ नहीं गिनी गईं।)`,
`Apply the same method to the Sun: check the Sun's sidereal degree S(t) every day. On the day the rashi number (the whole part of S ÷ 30) changes, the sankranti lies within that day. Then use bisection within that day to find the exact moment (when S is exactly a multiple of 30°). The Sun's average speed is about 0.9856° a day, so two sankrantis are about 30.4 days apart. Makar Sankranti is the moment the Sun enters Makar (270°). (Traditions about the punya kaal and so on differ and are not counted here.)`,
(yc.sankranti.find(x=>x.rashi==9)?[`${pn.inp.y} की मकर संक्रांति: ${dtf(yc.sankranti.find(x=>x.rashi==9).t)}।`,`Makar Sankranti of ${pn.inp.y}: ${dtf(yc.sankranti.find(x=>x.rashi==9).t)}.`]:null)),
st("एकादशी की तारीख: सूर्योदय पर तिथि","The date of Ekadashi: the tithi at sunrise",
`एकादशी तिथि चंद्र-सूर्य कोण 120° से 132° (शुक्ल) और 300° से 312° (कृष्ण) के बीच रहती है। पंचांग का दिन सूर्योदय से शुरू होता है, इसलिए सरल नियम है: <b>जिस दिन सूर्योदय पर एकादशी तिथि चल रही हो, वही उस दिन की एकादशी</b>। हर दिन का सूर्योदय निकालें, उस पल का कोण निकालें, तिथि = कोण ÷ 12 का पूर्णांक + 1, और देखें कि वह 11 या 26 है या नहीं। एक तिथि 19 से 26 घंटे की होती है, जबकि दिन 24 घंटे का: इसलिए कभी एकादशी दो सूर्योदय छू लेती है (दो दिन) और कभी किसी सूर्योदय पर आती ही नहीं (क्षय)। तब अलग परंपराएँ (स्मार्त, वैष्णव आदि) अलग दिन चुनती हैं; यहाँ सिर्फ सरल नियम लिया गया है।`,
`The Ekadashi tithi lies where the Moon-Sun angle is between 120° and 132° (Shukla) and between 300° and 312° (Krishna). The panchang day starts at sunrise, so the simple rule is: <b>the day on which the Ekadashi tithi is running at sunrise is that day's Ekadashi</b>. Work out each day's sunrise, the angle at that moment, tithi = angle ÷ 12 (whole part) + 1, and see whether it is 11 or 26. A tithi lasts 19 to 26 hours while a day is 24 hours: so sometimes Ekadashi touches two sunrises (two days) and sometimes no sunrise at all (kshaya). Then different traditions (Smarta, Vaishnava and others) choose different days; here only the simple rule is used.`,
[`${pn.inp.y} में इस नियम से ${yc.ekadashi.length} दिन मिले (साल में 24 एकादशी आती हैं, अधिक मास वाले साल में 26। जो एकादशी किसी भी सूर्योदय पर नहीं पड़ती, वह इस सरल नियम में छूट जाती है, इसलिए गिनती इससे कम आ सकती है)।`,`With this rule ${yc.ekadashi.length} days were found in ${pn.inp.y} (a year has 24 Ekadashis, 26 in a year with an adhik maas; an Ekadashi that falls on no sunrise is missed by this simple rule, so the count can come out lower).`]),
st("ग्रहण का गणित","The maths of eclipses",
`<b>सूर्य ग्रहण</b> अमावस्या को होता है (चंद्र सूर्य और पृथ्वी के बीच) और <b>चंद्र ग्रहण</b> पूर्णिमा को (पृथ्वी की छाया चंद्र पर)। पर हर अमावस्या-पूर्णिमा पर नहीं, क्योंकि चंद्र का रास्ता सूर्य के रास्ते से लगभग 5° झुका है। ग्रहण तभी बनता है जब अमावस्या या पूर्णिमा राहु या केतु (दो कटान-बिंदुओं) के पास पड़े। इसी से राहु-केतु का नाम ग्रहण से जुड़ा है। सूर्य हर साल लगभग 173 दिन में राहु-केतु रेखा पार करता है, इसलिए साल में ग्रहण के दो मौसम आते हैं और कुल 4 से 7 ग्रहण होते हैं। ऐप ग्रहण के पल और प्रकार आधुनिक खगोलीय एफेमेरिस के ग्रहण-सूत्रों से निकालता है (सूर्य ग्रहण: पूर्ण, वलयाकार, आंशिक, संकर; चंद्र ग्रहण: पूर्ण, आंशिक, उपछाया)।`,
`A <b>solar eclipse</b> happens at Amavasya (the Moon between the Sun and the Earth) and a <b>lunar eclipse</b> at Purnima (the Earth's shadow falls on the Moon). But not at every Amavasya or Purnima, because the Moon's path is tilted about 5° to the Sun's path. An eclipse happens only when the Amavasya or Purnima falls near Rahu or Ketu (the two crossing points). That is why the names Rahu-Ketu are tied to eclipses. The Sun crosses the Rahu-Ketu line about every 173 days, so there are two eclipse seasons a year and 4 to 7 eclipses in all. The app finds the moment and type of each eclipse from the eclipse routines of a modern astronomical ephemeris (solar: total, annular, partial, hybrid; lunar: total, partial, penumbral).`,
[`${pn.inp.y} के ग्रहण: ${[...yc.solar.map(x=>'सूर्य '+ECS[0][x.type][0]+' '+dtf(x.t).slice(0,10)),...yc.lunar.map(x=>'चंद्र '+ECS[1][x.type][0]+' '+dtf(x.t).slice(0,10))].join('; ')}।`,`Eclipses of ${pn.inp.y}: ${[...yc.solar.map(x=>'solar '+ECS[0][x.type][1]+' '+dtf(x.t).slice(0,10)),...yc.lunar.map(x=>'lunar '+ECS[1][x.type][1]+' '+dtf(x.t).slice(0,10))].join('; ')}.`]),
st("अभ्यास और सार","Practice and recap",
`<b>प्र.1</b> दो संक्रांतियों के बीच औसतन कितने दिन होते हैं?<details><summary style="cursor:pointer">उत्तर</summary>365.25 ÷ 12 ≈ ${f(365.25/12,2)} दिन।</details><br><b>प्र.2</b> अमावस्या से पूर्णिमा तक औसतन कितने दिन?<details><summary style="cursor:pointer">उत्तर</summary>29.53 ÷ 2 ≈ ${f(29.53/2,2)} दिन (कोण 0° से 180° तक, 180 ÷ 12.19 ≈ ${f(180/12.19,2)})।</details><br><b>प्र.3</b> किसी दिन सूर्योदय पर चंद्र-सूर्य कोण 125° है। तिथि कौन सी है?<details><summary style="cursor:pointer">उत्तर</summary>125 ÷ 12 = 10.4 → पूर्णांक 10, तिथि = 10 + 1 = 11: शुक्ल एकादशी।</details><br><b>सार:</b> (1) अमावस्या = कोण 0°, पूर्णिमा = 180°। (2) सटीक पल अनुमान को बार-बार सुधारकर मिलता है। (3) संक्रांति = सूर्य का अंश 30° का गुणज। (4) एकादशी = सूर्योदय पर तिथि 11 या 26। (5) ग्रहण = अमावस्या/पूर्णिमा का राहु-केतु के पास होना।`,
`<b>Q1</b> On average how many days are there between two sankrantis?<details><summary style="cursor:pointer">Answer</summary>365.25 ÷ 12 ≈ ${f(365.25/12,2)} days.</details><br><b>Q2</b> On average how many days from Amavasya to Purnima?<details><summary style="cursor:pointer">Answer</summary>29.53 ÷ 2 ≈ ${f(29.53/2,2)} days (angle 0° to 180°, 180 ÷ 12.19 ≈ ${f(180/12.19,2)}).</details><br><b>Q3</b> At the sunrise of some day the Moon-Sun angle is 125°. Which tithi is it?<details><summary style="cursor:pointer">Answer</summary>125 ÷ 12 = 10.4 → whole part 10, tithi = 10 + 1 = 11: Shukla Ekadashi.</details><br><b>Recap:</b> (1) Amavasya = angle 0°, Purnima = 180°. (2) The exact moment comes from correcting a guess again and again. (3) Sankranti = the Sun's degree at a multiple of 30°. (4) Ekadashi = tithi 11 or 26 at sunrise. (5) An eclipse = an Amavasya/Purnima near Rahu-Ketu.`)]},
{t:["गोचर","Gochar (transit)"],s:[
st("गोचर क्या है (गणित वाला हिस्सा)","What is gochar (the maths part)",
`ग्रह चलते रहते हैं। कुंडली जन्म के पल की तस्वीर है, और <b>गोचर</b> किसी और पल (जैसे आज) की तस्वीर है। गणित वही है जो कुंडली में था: उस तारीख-समय का JD, ग्रहों की निरयन स्थिति, फिर राशि-अंश-नक्षत्र। फर्क बस इतना कि यहाँ लग्न की ज़रूरत नहीं पड़ती। नीचे तालिका में हर ग्रह को एक राशि में औसतन लगभग कितना समय लगता है:`+tbl(["ग्रह","एक राशि में लगभग"],[[GN[0][1],"2.3 दिन"],[GN[0][0],"1 महीना"],[GN[0][3]+" / "+GN[0][5],"लगभग 1 महीना (बदलता है)"],[GN[0][2],"1.5 से 2 महीने"],[GN[0][4],"लगभग 1 साल"],[GN[0][6],"लगभग 2.5 साल"],[GN[0][7]+" / "+GN[0][8],"लगभग 1.5 साल (उल्टे)"]]),
`Grah keep moving. A kundali is the picture of the birth moment, and <b>gochar</b> is the picture of some other moment (such as today). The maths is the same as for the kundali: the JD of that date and time, the sidereal positions of the grah, then rashi-degree-nakshatra. The only difference is that no lagna is needed here. The table gives roughly how long each grah stays in one rashi on average:`+tbl(["Grah","Time in one rashi"],[[GN[1][1],"2.3 days"],[GN[1][0],"1 month"],[GN[1][3]+" / "+GN[1][5],"about 1 month (varies)"],[GN[1][2],"1.5 to 2 months"],[GN[1][4],"about 1 year"],[GN[1][6],"about 2.5 years"],[GN[1][7]+" / "+GN[1][8],"about 1.5 years (backwards)"]])),
st("गोचर में भाव गिनना: लग्न से और चंद्र से","Counting houses in gochar: from lagna and from the Moon",
`गोचर के ग्रह की जगह को अपनी कुंडली से जोड़ने के लिए भाव गिना जाता है। गिनती वही है जो भाव वाले अध्याय में थी (शुरू का भाव भी गिना जाता है)। गिनती के दो आम आधार हैं: <b>लग्न से</b> (जन्म-लग्न को भाव 1 मानकर) और <b>चंद्र से</b> (जन्म की चंद्र राशि को भाव 1 मानकर)। सूत्र: भाव = (गोचर ग्रह की राशि − आधार राशि) को 12 से घुमाकर + 1।<br>(किस भाव में किस ग्रह के गोचर का क्या फल माना जाता है, यह फलित है। यहाँ सिर्फ गिनती है।)`,
`To tie a transiting grah's place to your own kundali we count houses. The counting is the same as in the bhav chapter (the starting house is counted too). There are two common bases: <b>from the lagna</b> (taking the birth lagna as house 1) and <b>from the Moon</b> (taking the birth Moon rashi as house 1). Formula: house = (transiting grah's rashi − base rashi, wrapped around 12) + 1.<br>(What a grah's gochar in which house is believed to bring is falit. Here is only the counting.)`,
[`${pd}: ${GN[0][6]} ${RASHI[0][Math.floor(tr[6].lon/30)]} में। लग्न (${RASHI[0][lag]}) से भाव ${info(tr[6].lon,lag).h}; जन्म-चंद्र (${RASHI[0][mi.r]}) से भाव ${((Math.floor(tr[6].lon/30)-mi.r+12)%12)+1}`,`${pd}: ${GN[1][6]} in ${RASHI[1][Math.floor(tr[6].lon/30)]}. House ${info(tr[6].lon,lag).h} from lagna (${RASHI[1][lag]}); house ${((Math.floor(tr[6].lon/30)-mi.r+12)%12)+1} from the birth Moon (${RASHI[1][mi.r]})`]),
st("ऐप में गोचर","Gochar in the app",
`'गोचर' टैब में तारीख और समय चुनें (शुरू में आज का समय आता है) और जगह/टाइम ज़ोन ऊपर के खानों में रखें। अगर आपने कुंडली बना रखी है तो तालिका में 'लग्न से भाव' और 'चंद्र से भाव' के कॉलम और आपके लग्न पर बना गोचर चार्ट भी दिखेगा।`,
`In the 'Gochar' tab pick a date and time (it starts with the present time) and keep the place/time zone in the boxes above. If you have made a kundali, the table also shows 'House from lagna' and 'House from Moon' columns, along with a gochar chart drawn on your lagna.`)]},
{t:["वर्ग चार्ट: नवांश, दशांश","Varga charts: Navamsa, Dashamsa"],s:[
st("वर्ग चार्ट क्या हैं?","What are varga charts?",
`हर राशि (30°) को और छोटे बराबर हिस्सों में बाँटा जा सकता है, और हर हिस्से को एक राशि दे दी जाती है। इस तरह ग्रह की एक नई राशि बनती है, और सबकी नई राशियों से एक नया चार्ट बनता है जिसे कुंडली की तरह ही बनाया जाता है। इसे वर्ग (विभागीय) चार्ट कहते हैं। नाम में D के आगे की संख्या बताती है कि राशि कितने हिस्सों में बँटी।`+tbl(["चार्ट","हिस्से","हर हिस्से का नाप"],[["D1 राशि","1","30°"],["D9 नवांश","9","3°20'"],["D10 दशांश","10","3°"]])+`हर वर्ग चार्ट का अपना नियम है कि कौन सा हिस्सा किस राशि को मिले। (किस चार्ट से जीवन का कौन सा पहलू देखा जाता है, यह फलित है।)`,
`Each rashi (30°) can be split into smaller equal parts, and each part is given a rashi. This gives every grah a new rashi, and the new rashis make a new chart drawn just like a kundali. It is called a varga (divisional) chart. The number after D says into how many parts the rashi was split.`+tbl(["Chart","Parts","Size of each part"],[["D1 Rashi","1","30°"],["D9 Navamsa","9","3°20'"],["D10 Dashamsa","10","3°"]])+`Every varga chart has its own rule for which part gets which rashi. (Which area of life each chart is used to look at is falit.)`),
st("नवांश (D9) की गिनती","Navamsa (D9) calculation",
`राशि को 9 हिस्सों में बाँटने पर हर हिस्सा 3°20' का होता है, यानी ठीक एक नक्षत्र-पद। पूरे राशि चक्र में 108 पद हैं। मेष 0° से गिनते हुए पद 1 को मेष, पद 2 को वृषभ, ... पद 12 को मीन, पद 13 को फिर मेष मिलती है, और यह क्रम 108 तक चलता है। इसलिए: <b>पद संख्या ÷ 12 का शेष = नवांश की राशि</b> (शेष 0 = मेष)। परंपरा का नियम भी इसी के बराबर है: चर राशियाँ अपनी ही राशि से, स्थिर राशियाँ अपनी 9वीं राशि से, द्विस्वभाव राशियाँ अपनी 5वीं राशि से नवांश शुरू करती हैं। तालिका में हर राशि का पहला नवांश है:`+tbl(["राशि","पहला नवांश"],[...Array(12)].map((_,k)=>[RASHI[0][k],RASHI[0][(k*9)%12]])),
`Splitting a rashi into 9 parts makes each part 3°20', exactly one nakshatra pada. The whole zodiac has 108 padas. Counting from Mesh 0°, pada 1 gets Mesh, pada 2 Vrishabh, ... pada 12 Meen, pada 13 Mesh again, and this runs on to 108. So: <b>pada number ÷ 12, remainder = navamsa rashi</b> (remainder 0 = Mesh). The traditional rule gives the same result: movable rashis start their navamsa from their own rashi, fixed rashis from their 9th rashi, dual rashis from their 5th rashi. The table shows the first navamsa of every rashi:`+tbl(["Rashi","First navamsa"],[...Array(12)].map((_,k)=>[RASHI[1][k],RASHI[1][(k*9)%12]])),
[`${GN[0][0]} ${f(sun.lon)}° ÷ 3°20' → ${Math.floor(sun.lon/(10/3)+1e-9)} पूरे पद बीते → ${Math.floor(sun.lon/(10/3)+1e-9)} ÷ 12 का शेष ${Math.floor(sun.lon/(10/3)+1e-9)%12} → नवांश ${RASHI[0][Math.floor(sun.lon/(10/3)+1e-9)%12]}`,`${GN[1][0]} ${f(sun.lon)}° ÷ 3°20' → ${Math.floor(sun.lon/(10/3)+1e-9)} full padas passed → ${Math.floor(sun.lon/(10/3)+1e-9)} ÷ 12 remainder ${Math.floor(sun.lon/(10/3)+1e-9)%12} → navamsa ${RASHI[1][Math.floor(sun.lon/(10/3)+1e-9)%12]}`]),
st("दशांश (D10) की गिनती","Dashamsa (D10) calculation",
`राशि के 30° को 10 हिस्सों में बाँटते हैं, हर हिस्सा 3° का। हिस्सा संख्या p = राशि के भीतर का अंश ÷ 3 का पूर्णांक (0 से 9)। नियम: <b>विषम राशियाँ</b> (मेष, मिथुन, सिंह, तुला, धनु, कुंभ) अपनी ही राशि से गिनना शुरू करती हैं। <b>सम राशियाँ</b> (वृषभ, कर्क, कन्या, वृश्चिक, मकर, मीन) अपनी 9वीं राशि से। दशांश राशि = (शुरुआती राशि + p) को 12 से घुमाकर।`,
`The 30° of a rashi is split into 10 parts of 3° each. Part number p = the degree inside the rashi ÷ 3, whole part (0 to 9). Rule: <b>odd rashis</b> (Mesh, Mithun, Singh, Tula, Dhanu, Kumbh) start counting from their own rashi. <b>Even rashis</b> (Vrishabh, Kark, Kanya, Vrishchik, Makar, Meen) start from their 9th rashi. Dashamsa rashi = (starting rashi + p), wrapped around 12.`,
[`${GN[0][0]}: ${RASHI[0][si.r]} ${dm(si.d)} → p = ${Math.floor(si.d/3+1e-9)}; ${si.r%2==0?'विषम':'सम'} राशि, शुरुआत ${RASHI[0][si.r%2==0?si.r:(si.r+8)%12]} → दशांश ${RASHI[0][vsign(sun.lon,10)]}`,`${GN[1][0]}: ${RASHI[1][si.r]} ${dm(si.d)} → p = ${Math.floor(si.d/3+1e-9)}; ${si.r%2==0?'odd':'even'} rashi, start ${RASHI[1][si.r%2==0?si.r:(si.r+8)%12]} → dashamsa ${RASHI[1][vsign(sun.lon,10)]}`]),
st("ऐप में वर्ग चार्ट","Varga charts in the app",
`कुंडली टैब में चार्ट के नीचे 'वर्ग चार्ट' का खाना है। वहाँ D1, D9 और D10 के बटन हैं। चुने हुए चार्ट का उत्तर भारतीय चार्ट और हर ग्रह की उस वर्ग में राशि दिखती है। लग्न को भी उसी नियम से बदला जाता है। (D9 में 'लग्न' का मतलब लग्न बिंदु का नवांश है।)`,
`In the Kundali tab there is a 'Varga charts' box below the charts, with buttons for D1, D9 and D10. It shows the North Indian chart of the chosen varga and each grah's rashi in it. The lagna is converted by the same rule. (The 'lagna' of D9 means the navamsa of the lagna point.)`)]},
{t:["अष्टकवर्ग","Ashtakvarga"],s:[
st("अष्टकवर्ग क्या है","What is Ashtakvarga",
`अष्ट = आठ, वर्ग = समूह। यह 'आठ स्रोतों' की गिनती है: सात ग्रह (सूर्य से शनि) और लग्न। राहु-केतु इसमें नहीं गिने जाते। हर ग्रह के लिए एक <b>भिन्नाष्टकवर्ग</b> बनता है: उस ग्रह को बाकी सातों ग्रह और लग्न अपनी-अपनी जगह से गिनकर कुछ तय भावों में एक-एक <b>बिंदु</b> (शुभ अंक) देते हैं, बाकी भावों में <b>रेखा</b> (बिंदु नहीं)। नतीजा: 12 राशियों में से हर राशि के लिए 0 से 8 तक का एक अंक। सातों के भिन्नाष्टकवर्ग राशि-दर-राशि जोड़ने पर <b>सर्वाष्टकवर्ग (SAV)</b> बनता है। इस पाठ में सिर्फ गणित है; इन अंकों का क्या अर्थ निकाला जाता है, वह फलित में आएगा। बृहत् पाराशर होरा शास्त्र में अष्टकवर्ग का पूरा अध्याय है।`,
`Ashta = eight, varga = group. It is a count from 'eight sources': the seven grah (Sun to Saturn) and the lagna. Rahu-Ketu are not counted. For each grah one <b>Bhinnashtakvarga</b> is built: the other seven grah and the lagna, counting from their own places, give that grah one <b>bindu</b> (a benefic point) in certain fixed houses and a <b>rekha</b> (no point) in the rest. The result is a number from 0 to 8 for every one of the 12 rashis. Adding the seven Bhinnashtakvargas rashi by rashi gives the <b>Sarvashtakvarga (SAV)</b>. This lesson is only maths; what these numbers are taken to mean comes in falit. The Brihat Parashara Hora Shastra has a full chapter on Ashtakvarga.`),
st("तालिका: कौन किसे किन भावों में बिंदु देता है","The table: who gives a bindu to whom, and in which houses",
`नीचे सातों ग्रहों की तालिका है। 'भाव' का मतलब देने वाले (स्रोत) की अपनी राशि से गिना गया भाव है, और शुरू वाली राशि भी 1 गिनी जाती है। हर ग्रह के कुल बिंदु हमेशा तय हैं: सूर्य 48, चंद्र 49, मंगल 39, बुध 54, गुरु 56, शुक्र 52, शनि 39, यानी कुल 337। (मैंने ये तालिकाएँ BPHS की प्रचलित सूचियों के अनुसार ली हैं। हर पंक्ति के बिंदुओं की गिनती और ये कुल जोड़ मैंने स्वतंत्र स्रोतों से मिलाए हैं, पर अलग-अलग ग्रंथों के पाठ में थोड़ा भेद मिल सकता है; इसलिए इन्हें BPHS के मूल अध्याय से भी मिला लें।)`+AVTB,
`Below is the table for the seven grah. 'House' means the house counted from the giver's (source's) own rashi, with the starting rashi counted as 1. The total bindus of each grah are always fixed: Sun 48, Moon 49, Mars 39, Mercury 54, Jupiter 56, Venus 52, Saturn 39, i.e. 337 in all. (I took these tables from the commonly used BPHS lists. I cross-checked the number of points in each row and these totals with independent sources, but the readings of different texts can differ slightly; so also check them against the original chapter of the BPHS.)`+AVTB),
st("भिन्नाष्टकवर्ग बनाना: कदम-दर-कदम (सूर्य का, आपकी कुंडली से)","Building a Bhinnashtakvarga step by step (the Sun's, from your kundali)",
`<b>कदम 1:</b> आठ स्रोतों की राशि लिखें (सूर्य, चंद्र, ... शनि, लग्न)। <b>कदम 2:</b> हर स्रोत के लिए तालिका से भावों की सूची लें। <b>कदम 3:</b> स्रोत की राशि से उतने-उतने भाव गिनकर देखें कि वे कौन सी राशियाँ हैं (शुरू वाली = 1)। <b>कदम 4:</b> हर राशि को जितनी बार चुना गया, उतने बिंदु।`+tbl(["स्रोत","उसकी राशि","भाव (तालिका से)","वे राशियाँ"],AVST),
`<b>Step 1:</b> write down the rashi of the eight sources (Sun, Moon, ... Saturn, lagna). <b>Step 2:</b> for each source take its list of houses from the table. <b>Step 3:</b> count those houses from the source's rashi and note which rashis they are (the starting one = 1). <b>Step 4:</b> each rashi gets one bindu for every time it was picked.`+tbl(["Source","Its rashi","Houses (from table)","Those rashis"],AVST),
[`सूर्य के बिंदु (मेष से मीन): ${av.bav[0].join(', ')} (जोड़ ${av.bav[0].reduce((x,y)=>x+y,0)})`,`Sun's bindus (Mesh to Meen): ${av.bav[0].join(', ')} (total ${av.bav[0].reduce((x,y)=>x+y,0)})`]),
st("सर्वाष्टकवर्ग और जाँच के नियम","Sarvashtakvarga and the checks",
`सातों भिन्नाष्टकवर्ग राशि-दर-राशि जोड़ने पर सर्वाष्टकवर्ग (SAV) बनता है। इसका कुल जोड़ हमेशा 337 होता है, और 12 राशियों का औसत 337 ÷ 12 ≈ 28.08। <b>जाँच:</b> क्योंकि हर ग्रह की तालिका के भावों की गिनती तय है और राशियाँ सिर्फ घूमकर शिफ्ट होती हैं, इसलिए हर कुंडली में हर ग्रह का जोड़ वही आता है (सूर्य 48, चंद्र 49 ...)। अगर आपका हाथ का जोड़ अलग आए तो कहीं गिनती में गलती है। यह एक बढ़िया तरीका है अपनी गलती खुद पकड़ने का।`+tbl(["ग्रह","अपेक्षित जोड़","आपकी कुंडली का जोड़"],[...Array(7)].map((_,p)=>[GN[0][p],AVX[p],av.bav[p].reduce((x,y)=>x+y,0)]).concat([["सर्वाष्टकवर्ग",337,av.sav.reduce((x,y)=>x+y,0)]])),
`Adding the seven Bhinnashtakvargas rashi by rashi gives the Sarvashtakvarga (SAV). Its grand total is always 337 and the average over the 12 rashis is 337 ÷ 12 ≈ 28.08. <b>The check:</b> because the number of houses in each grah's table is fixed and the rashis only shift round, every kundali gives the same total for every grah (Sun 48, Moon 49 ...). If your total by hand differs, there is a counting mistake somewhere. This is a good way to catch your own errors.`+tbl(["Grah","Expected total","Your kundali's total"],[...Array(7)].map((_,p)=>[GN[1][p],AVX[p],av.bav[p].reduce((x,y)=>x+y,0)]).concat([["Sarvashtakvarga",337,av.sav.reduce((x,y)=>x+y,0)]]))),
st("काक्षा: हर राशि के 8 हिस्से","Kakshya: the 8 parts of each rashi",
`हर राशि (30°) को आठ बराबर हिस्सों में बाँटा जाता है, हर एक 3°45' का। इन्हें काक्षा कहते हैं और इनके स्वामी इसी क्रम में हैं: शनि, गुरु, मंगल, सूर्य, शुक्र, बुध, चंद्र, लग्न। सूत्र: राशि के भीतर का अंश ÷ 3°45' का पूर्णांक = काक्षा संख्या (0 से 7)। यह भी अष्टकवर्ग के आठ स्रोतों से जुड़ा है, इसलिए यहीं सीखा जाता है।`+tbl(["ग्रह","राशि और अंश","काक्षा संख्या","काक्षा स्वामी"],KKR),
`Each rashi (30°) is divided into eight equal parts of 3°45' each. These are called kakshyas and they are ruled in this order: Saturn, Jupiter, Mars, Sun, Venus, Mercury, Moon, lagna. Formula: the degree inside the rashi ÷ 3°45', whole part = kakshya number (0 to 7). This also belongs to the eight sources of Ashtakvarga, which is why it is learnt here.`+tbl(["Grah","Rashi and degree","Kakshya no.","Kakshya lord"],KKR)),
st("अभ्यास और सार","Practice and recap",
`<b>प्र.1</b> बुध के भिन्नाष्टकवर्ग में आपकी लग्न राशि (${RASHI[0][lagS]}) को कितने बिंदु मिलते हैं, और कौन-कौन से स्रोत देते हैं?<details><summary style="cursor:pointer">उत्तर</summary>${AVQ0}</details><br><b>प्र.2</b> आपके सर्वाष्टकवर्ग में सबसे ज़्यादा बिंदु किस राशि में हैं?<details><summary style="cursor:pointer">उत्तर</summary>${RASHI[0][av.sav.indexOf(Math.max(...av.sav))]}: ${Math.max(...av.sav)} बिंदु। सबसे कम: ${RASHI[0][av.sav.indexOf(Math.min(...av.sav))]}: ${Math.min(...av.sav)} बिंदु। (इनका अर्थ फलित में।)</details><br><b>सार:</b> (1) आठ स्रोत: 7 ग्रह + लग्न। (2) हर ग्रह की तालिका तय है। (3) स्रोत की राशि से भाव गिनें, शुरू वाली = 1। (4) हर चुनी गई राशि को 1 बिंदु। (5) जोड़: सूर्य 48, चंद्र 49, मंगल 39, बुध 54, गुरु 56, शुक्र 52, शनि 39, कुल 337। आगे आने वाले विषय (शोधन, गोचर में अष्टकवर्ग का उपयोग) अलग से सीखेंगे।`,
`<b>Q1</b> In Mercury's Bhinnashtakvarga how many bindus does your lagna rashi (${RASHI[1][lagS]}) get, and which sources give them?<details><summary style="cursor:pointer">Answer</summary>${AVQ1}</details><br><b>Q2</b> In your Sarvashtakvarga which rashi has the most bindus?<details><summary style="cursor:pointer">Answer</summary>${RASHI[1][av.sav.indexOf(Math.max(...av.sav))]}: ${Math.max(...av.sav)} bindus. Fewest: ${RASHI[1][av.sav.indexOf(Math.min(...av.sav))]}: ${Math.min(...av.sav)} bindus. (What they mean is for falit.)</details><br><b>Recap:</b> (1) Eight sources: 7 grah + lagna. (2) Each grah's table is fixed. (3) Count houses from the source's rashi, the starting one = 1. (4) Each picked rashi gets 1 bindu. (5) Totals: Sun 48, Moon 49, Mars 39, Mercury 54, Jupiter 56, Venus 52, Saturn 39, in all 337. Later topics (shodhana, using Ashtakvarga in gochar) will be learnt separately.`)]},
{t:["वर्षफल","Varshphal"],s:[
st("वर्षफल क्या है","What is Varshphal",
`वर्षफल (ताजिक पद्धति) एक साल के लिए बनी कुंडली है। सूर्य एक साल में राशि चक्र का एक पूरा चक्कर लगाता है। हर साल जिस पल सूर्य ठीक उसी निरयन अंश पर लौटता है जहाँ वह आपके जन्म के समय था, उस पल को <b>वर्ष प्रवेश</b> कहते हैं। उसी पल की कुंडली (उसी जगह के लिए) वर्ष-कुंडली है। इस पाठ में सिर्फ गणित है; इस कुंडली का फल कैसे पढ़ा जाता है, यह फलित में आएगा।`,
`Varshphal (the Tajika method) is a chart made for one year. The Sun makes one full round of the zodiac in a year. Each year the moment the Sun returns to exactly the same sidereal degree it had at your birth is called the <b>Varsha Pravesh</b>. The chart for that moment (for a chosen place) is the year chart. This lesson is only maths; how the year chart is read comes in falit.`),
st("सूर्य की वापसी का समय कैसे निकालें","How to find the time of the Sun's return",
`<b>कदम 1:</b> जन्म के सूर्य का निरयन अंश L लें। <b>कदम 2:</b> जन्म से (साल × 365.2564 दिन) बाद का मोटा समय लें (365.2564 दिन निरयन वर्ष है, यानी तारों के हिसाब से सूर्य का एक चक्कर)। <b>कदम 3:</b> उस समय सूर्य का अंश निकालें और L से उसका अंतर d देखें। <b>कदम 4:</b> सूर्य लगभग 0.9856° प्रतिदिन चलता है (असल में 0.95° से 1.02°), इसलिए समय को d ÷ (सूर्य की चाल) दिन से सुधारें। <b>कदम 5:</b> यही दोहराते रहें जब तक अंतर लगभग शून्य न हो जाए। कुछ ही दोहराव में अंतर 0.000000001° से नीचे आ जाता है।`,
`<b>Step 1:</b> take the Sun's sidereal degree L at birth. <b>Step 2:</b> take a rough time of (years × 365.2564 days) after birth (365.2564 days is the sidereal year, i.e. one round of the Sun against the stars). <b>Step 3:</b> work out the Sun's degree at that time and see its difference d from L. <b>Step 4:</b> the Sun moves about 0.9856° a day (really 0.95° to 1.02°), so correct the time by d ÷ (Sun's speed) days. <b>Step 5:</b> keep repeating until the difference is almost zero. In a few rounds the difference falls below 0.000000001°.`,
[`आपके जन्म का सूर्य ${f(vs.natal_sun,4)}°। ${vyr} में वापसी: ${vs.local} (उम्र ${vs.age})। उस पल सूर्य ${f(vs.sun_check,4)}° (अंतर लगभग शून्य)।`,`Your birth Sun ${f(vs.natal_sun,4)}°. Return in ${vyr}: ${vs.local} (age ${vs.age}). At that moment the Sun is at ${f(vs.sun_check,4)}° (difference almost zero).`]),
st("सायन और निरयन वापसी में फर्क","Tropical versus sidereal return",
`सायन वर्ष (ऋतुओं का वर्ष) 365.2422 दिन का है और निरयन वर्ष (तारों वाला) 365.2564 दिन का। दोनों में हर साल लगभग 0.0142 दिन यानी करीब 20 मिनट का अंतर है (अयन-चलन के कारण)। 30 साल बाद यह अंतर लगभग 10 घंटे हो जाता है। भारत की ताजिक वर्षफल गणना आम तौर पर निरयन वापसी लेती है (यह ऐप भी)। कुछ पद्धतियाँ सायन वापसी लेती हैं, इसलिए अलग-अलग सॉफ्टवेयर में वर्ष-प्रवेश का समय कई घंटे अलग मिल सकता है।`,
`The tropical year (the year of the seasons) is 365.2422 days and the sidereal year (against the stars) is 365.2564 days. They differ by about 0.0142 day, roughly 20 minutes, every year (because of precession). After 30 years the gap is about 10 hours. Tajika varshphal in India generally takes the sidereal return (this app does too). Some methods take the tropical return, so different software can give a Varsha Pravesh time that differs by several hours.`,
[`${GN[0][0]}: निरयन वर्ष 365.2564 − सायन वर्ष 365.2422 = 0.0142 दिन = ${f(0.0142*1440,1)} मिनट प्रति वर्ष; आपकी उम्र ${vs.age} पर ≈ ${f(0.0142*24*vs.age,1)} घंटे।`,`Sidereal year 365.2564 − tropical year 365.2422 = 0.0142 day = ${f(0.0142*1440,1)} minutes a year; at your age ${vs.age} ≈ ${f(0.0142*24*vs.age,1)} hours.`]),
st("मुंथा की गिनती","Counting the Muntha",
`<b>मुंथा</b> वर्षफल का एक बिंदु है जो जन्म के समय लग्न की राशि से शुरू होता है और हर साल एक राशि आगे बढ़ता है। सूत्र: मुंथा की राशि = (जन्म-लग्न की राशि संख्या + पूरे हुए वर्ष) को 12 से घुमाकर। फिर वर्ष-कुंडली में इसका भाव वर्ष-लग्न से गिना जाता है (शुरू वाली राशि = भाव 1)। (मुंथा का फल क्या माना जाता है, यह फलित में।)`,
`The <b>Muntha</b> is a point of the year chart that starts at the birth lagna's rashi and moves one rashi forward every year. Formula: Muntha rashi = (birth lagna's rashi number + completed years), wrapped around 12. Its house in the year chart is then counted from the Varsha lagna (the starting rashi = house 1). (What the Muntha is believed to bring is falit.)`,
[`जन्म-लग्न ${RASHI[0][lagS]} (संख्या ${lagS+1}) + ${vs.age} वर्ष → मुंथा ${RASHI[0][vs.muntha]}; वर्ष-लग्न ${RASHI[0][Math.floor(vs.lagna/30)]} से भाव ${((vs.muntha-Math.floor(vs.lagna/30)+12)%12)+1}`,`Birth lagna ${RASHI[1][lagS]} (number ${lagS+1}) + ${vs.age} years → Muntha ${RASHI[1][vs.muntha]}; house ${((vs.muntha-Math.floor(vs.lagna/30)+12)%12)+1} from Varsha lagna ${RASHI[1][Math.floor(vs.lagna/30)]}`]),
st("अभ्यास और आगे","Practice and what is next",
`<b>प्र.1</b> जन्म-लग्न मीन हो तो 12 साल पूरे होने पर मुंथा किस राशि में होगा?<details><summary style="cursor:pointer">उत्तर</summary>मीन = संख्या 12; (12 + 12) ÷ 12 का शेष 0 यानी 12 वाँ स्थान: मीन फिर से। (हर 12 साल में मुंथा अपनी राशि पर लौटता है।)</details><br><b>प्र.2</b> वर्ष प्रवेश का घड़ी-समय हर साल लगभग 6 घंटे आगे क्यों खिसकता है?<details><summary style="cursor:pointer">उत्तर</summary>निरयन वर्ष 365 दिन से लगभग 0.2564 दिन (≈ 6.15 घंटे) लंबा है। लीप वर्ष में एक दिन जुड़ने से यह खिसकाव वापस ठीक हो जाता है, इसलिए समय आगे-पीछे घूमता रहता है।</details><br><b>आगे (बाद में):</b> वर्ष का स्वामी (वर्षेश), मुद्दा दशा और सहम की गणना अभी ऐप में नहीं है; इनके सूत्र जाँचकर ही जोड़े जाएँगे।`,
`<b>Q1</b> If the birth lagna is Meen, in which rashi is the Muntha when 12 years are complete?<details><summary style="cursor:pointer">Answer</summary>Meen = number 12; (12 + 12) wrapped around 12 gives place 12: Meen again. (Every 12 years the Muntha returns to its own rashi.)</details><br><b>Q2</b> Why does the clock time of the Varsha Pravesh move about 6 hours later each year?<details><summary style="cursor:pointer">Answer</summary>The sidereal year is about 0.2564 day (≈ 6.15 hours) longer than 365 days. A leap day corrects this shift, so the time keeps swinging forward and back.</details><br><b>Later:</b> the year lord (Varshesh), Mudda dasha and the sahams are not in the app yet; they will be added only after their formulas are checked.`)]},
{t:["शड्बल","Shadbala"],s:[
st("शड्बल क्या है","What is Shadbala",
`शड्बल = षट् (छह) + बल। यह सात ग्रहों (सूर्य से शनि; राहु-केतु नहीं) की ताकत को छह स्रोतों से नापने की पद्धति है: <b>स्थान बल</b> (राशि-वर्ग में स्थिति; इसके 5 उपभाग: उच्च, सप्तवर्गज, ओजयुग्म, केंद्रादि, द्रेष्काण), <b>दिग् बल</b> (दिशा), <b>काल बल</b> (समय), <b>चेष्टा बल</b> (गति), <b>नैसर्गिक बल</b> (स्वाभाविक) और <b>दृग् बल</b> (दृष्टि)। इकाई विरूप (षष्ट्यंश) है; 60 विरूप = 1 रूप। BPHS के अध्याय 27 के अनुसार हर ग्रह के लिए न्यूनतम रूप तय हैं: सूर्य 6.5, चंद्र 6, मंगल 5, बुध 7, गुरु 6.5, शुक्र 5.5, शनि 5। <b>इस ऐप में अभी सिर्फ चार अंश हैं:</b> उच्च, दिग्, केंद्रादि और नैसर्गिक। बाकी (सप्तवर्गज, ओजयुग्म, द्रेष्काण, काल, चेष्टा, दृग्) के सूत्र कई हिस्सों वाले हैं और स्रोतों में अलग-अलग मिलते हैं, इसलिए उन्हें जाँचे बिना जोड़ना ठीक नहीं होगा। इसी वजह से कुल शड्बल अभी नहीं जोड़ा।`,
`Shadbala = shat (six) + bala (strength). It measures the strength of the seven grah (Sun to Saturn; not Rahu-Ketu) from six sources: <b>Sthana bala</b> (position in rashi and vargas; 5 sub-parts: Uccha, Saptavargaja, Ojayugma, Kendradi, Drekkana), <b>Dig bala</b> (direction), <b>Kala bala</b> (time), <b>Cheshta bala</b> (motion), <b>Naisargika bala</b> (natural) and <b>Drik bala</b> (aspect). The unit is the virupa (shashtiamsa); 60 virupas = 1 rupa. According to BPHS chapter 27 each grah has a minimum number of rupas: Sun 6.5, Moon 6, Mars 5, Mercury 7, Jupiter 6.5, Venus 5.5, Saturn 5. <b>This app has only four parts for now:</b> Uccha, Dig, Kendradi and Naisargika. The formulas for the rest (Saptavargaja, Ojayugma, Drekkana, Kala, Cheshta, Drik) have many sub-parts and differ between sources, so adding them without checking would not be right. That is why the total Shadbala is not added yet.`),
st("नैसर्गिक बल","Naisargika bala",
`यह हर ग्रह का स्थायी बल है, कुंडली से नहीं बदलता: सूर्य 60, चंद्र 51.43, शुक्र 42.86, गुरु 34.29, बुध 25.71, मंगल 17.14, शनि 8.57 विरूप। सूत्र: 60 × k ÷ 7, जहाँ k = 7 (सूर्य), 6 (चंद्र), 5 (शुक्र), 4 (गुरु), 3 (बुध), 2 (मंगल), 1 (शनि)। यानी हर क्रम में 60÷7 कम।`+tbl(["ग्रह","k","नैसर्गिक बल"],[0,1,5,4,3,2,6].map(i=>[GN[0][i],NK7[i],f(60*NK7[i]/7,2)])),
`This is each grah's permanent strength and does not change with the kundali: Sun 60, Moon 51.43, Venus 42.86, Jupiter 34.29, Mercury 25.71, Mars 17.14, Saturn 8.57 virupas. Formula: 60 × k ÷ 7, where k = 7 (Sun), 6 (Moon), 5 (Venus), 4 (Jupiter), 3 (Mercury), 2 (Mars), 1 (Saturn). So each step in the order is 60÷7 less.`+tbl(["Grah","k","Naisargika bala"],[0,1,5,4,3,2,6].map(i=>[GN[1][i],NK7[i],f(60*NK7[i]/7,2)]))),
st("उच्च बल","Uccha bala",
`हर ग्रह का एक उच्च बिंदु है: सूर्य मेष 10°, चंद्र वृषभ 3°, मंगल मकर 28°, बुध कन्या 15°, गुरु कर्क 5°, शुक्र मीन 27°, शनि तुला 20°। उसके ठीक सामने (180° दूर) नीच बिंदु है। सूत्र: <b>ग्रह के अंश और उसके नीच बिंदु के बीच की दूरी (0 से 180°) ÷ 3</b>। उच्च बिंदु पर दूरी 180° होती है, इसलिए 60 विरूप (पूरा बल); नीच बिंदु पर 0। बीच में बराबर चढ़ाव-उतार।`+tbl(["ग्रह","उच्च बिंदु (अंश)","नीच बिंदु (अंश)","आपका उच्च बल"],sbc.map((x,i)=>[GN[0][i],f(EXA[i],0)+'°',f((EXA[i]+180)%360,0)+'°',f(x.uc,2)])),
`Each grah has an exaltation point: Sun Mesh 10°, Moon Vrishabh 3°, Mars Makar 28°, Mercury Kanya 15°, Jupiter Kark 5°, Venus Meen 27°, Saturn Tula 20°. Exactly opposite (180° away) is its debilitation point. Formula: <b>the distance (0 to 180°) between the grah's longitude and its debilitation point ÷ 3</b>. At the exaltation point the distance is 180°, so 60 virupas (full strength); at the debilitation point 0. In between it rises and falls evenly.`+tbl(["Grah","Exaltation (longitude)","Debilitation (longitude)","Your Uccha bala"],sbc.map((x,i)=>[GN[1][i],f(EXA[i],0)+'°',f((EXA[i]+180)%360,0)+'°',f(x.uc,2)])),
[`उदाहरण: सूर्य 30° (मेष 30°=वृषभ 0°) पर: नीच बिंदु 190°; दूरी = 190 − 30 = 160°; 160 ÷ 3 = ${f(160/3,2)} विरूप।`,`Example: Sun at longitude 30° (Vrishabh 0°): debilitation point 190°; distance = 190 − 30 = 160°; 160 ÷ 3 = ${f(160/3,2)} virupas.`]),
st("दिग् बल","Dig bala",
`हर ग्रह की एक पसंदीदा दिशा (कुंडली का एक कोण) है: बुध-गुरु लग्न (पूर्व), सूर्य-मंगल दशम (दक्षिण, MC), शनि सप्तम (पश्चिम), चंद्र-शुक्र चतुर्थ (उत्तर, IC)। उस कोण के ठीक सामने का बिंदु 'शून्य बल बिंदु' है। सूत्र: <b>ग्रह की उस शून्य बल बिंदु से दूरी (0 से 180°) ÷ 3</b>। लग्न और MC निरयन अंश में ऐप सीधे निकालता है।`+tbl(["ग्रह","बलवान कोण","शून्य बल बिंदु","आपका दिग् बल"],sbc.map((x,i)=>[GN[0][i],[`MC`,`IC`,`MC`,`लग्न`,`लग्न`,`IC`,`अस्त (DSC)`][i],[`IC`,`MC`,`IC`,`अस्त (DSC)`,`अस्त (DSC)`,`MC`,`लग्न`][i],f(x.dig,2)])),
`Each grah has a favourite direction (an angle of the chart): Mercury-Jupiter the lagna (east), Sun-Mars the 10th (south, MC), Saturn the 7th (west), Moon-Venus the 4th (north, IC). The point exactly opposite that angle is the 'zero-strength point'. Formula: <b>the grah's distance (0 to 180°) from its zero-strength point ÷ 3</b>. The app works out the lagna and MC in sidereal degrees directly.`+tbl(["Grah","Strong angle","Zero-strength point","Your Dig bala"],sbc.map((x,i)=>[GN[1][i],[`MC`,`IC`,`MC`,`Lagna`,`Lagna`,`IC`,`DSC`][i],[`IC`,`MC`,`IC`,`DSC`,`DSC`,`MC`,`Lagna`][i],f(x.dig,2)])),
[`आपका लग्न ${f(r.lagna,2)}° और MC ${f(r.mc,2)}° है।`,`Your lagna is ${f(r.lagna,2)}° and your MC ${f(r.mc,2)}°.`]),
st("केंद्रादि बल","Kendradi bala",
`ग्रह जिस भाव में है उसके अनुसार: केंद्र (1, 4, 7, 10) में 60 विरूप, पणफर (2, 5, 8, 11) में 30, आपोक्लिम (3, 6, 9, 12) में 15। यहाँ भाव पूरी-राशि पद्धति से गिने गए हैं (कुछ सॉफ्टवेयर भाव-मध्य पद्धति लेते हैं, इसलिए सीमा के पास के ग्रहों में फर्क आ सकता है)।`+tbl(["ग्रह","भाव","केंद्रादि बल"],sbc.map((x,i)=>[GN[0][i],x.h,x.ken])),
`By the house the grah occupies: in a kendra (1, 4, 7, 10) 60 virupas, in a panaphara (2, 5, 8, 11) 30, in an apoklima (3, 6, 9, 12) 15. Here houses are counted by the Whole Sign method (some software use the bhava-madhya method, so grah near house borders can differ).`+tbl(["Grah","House","Kendradi bala"],sbc.map((x,i)=>[GN[1][i],x.h,x.ken]))),
st("अभ्यास, सावधानी और आगे","Practice, a caution and what is next",
`<b>प्र.1</b> चंद्र ${f(mo.lon,2)}° पर है। उसका उच्च बल हाथ से निकालिए।<details><summary style="cursor:pointer">उत्तर</summary>चंद्र का नीच बिंदु = 33 + 180 = 213°। दूरी = |${f(mo.lon,2)} − 213| = ${f(distA(mo.lon,213),2)}°। ÷ 3 = ${f(distA(mo.lon,213)/3,2)} विरूप (ऐप की तालिका से मिलाएँ)।</details><br><b>प्र.2</b> अगर कोई ग्रह अपने उच्च बिंदु पर हो तो उसका उच्च बल कितना होगा?<details><summary style="cursor:pointer">उत्तर</summary>नीच बिंदु से दूरी 180° → 180 ÷ 3 = 60 विरूप (पूरा)।</details><br><b>सावधानी:</b> मैंने कई स्रोत देखे तो एक स्रोत में गुरु का सबसे बलवान दिग्-भाव नवम लिखा था, जबकि बाकी सब में लग्न; दूसरे स्रोतों में अन्य विवरण भी नहीं मिलते। इसीलिए ऐप में सिर्फ वही हिस्से हैं जिनके सूत्र कई स्रोतों में एक जैसे मिले। <b>आगे:</b> सप्तवर्गज, ओजयुग्म, द्रेष्काण, काल, चेष्टा और दृग् बल, पहले उनके सूत्र BPHS से जाँचकर।`,
`<b>Q1</b> The Moon is at ${f(mo.lon,2)}°. Work out its Uccha bala by hand.<details><summary style="cursor:pointer">Answer</summary>The Moon's debilitation point = 33 + 180 = 213°. Distance = |${f(mo.lon,2)} − 213| = ${f(distA(mo.lon,213),2)}°. ÷ 3 = ${f(distA(mo.lon,213)/3,2)} virupas (compare with the app's table).</details><br><b>Q2</b> If a grah is exactly at its exaltation point, what is its Uccha bala?<details><summary style="cursor:pointer">Answer</summary>Distance from the debilitation point 180° → 180 ÷ 3 = 60 virupas (full).</details><br><b>A caution:</b> among the sources I looked at, one gave the 9th house as Jupiter's strongest dig house while all the others said the lagna. That is why the app has only the parts whose formulas agreed across several sources. <b>Next:</b> Saptavargaja, Ojayugma, Drekkana, Kala, Cheshta and Drik bala, after checking their formulas against the BPHS.`)]},
{t:["वास्तु: दिशाओं का गणित","Vastu: the maths of directions"],s:[
st("वास्तु: क्या है और यहाँ क्या सीखेंगे","Vastu: what it is and what we learn here",
`वास्तु शास्त्र भवन, भूमि और दिशाओं का शास्त्र है। इसके प्राचीन ग्रंथों में बृहत्संहिता (जिसमें वास्तुविद्या का अध्याय है), मयमत, समरांगण सूत्रधार, मानसार और विश्वकर्मा प्रकाश जैसे नाम लिए जाते हैं (जाँचें)। शास्त्र के दो हिस्से किए जा सकते हैं: <b>1. गणित-ज्यामिति वाला हिस्सा:</b> दिशा निकालना, सूर्य की दिशा, छाया (शंकु), भूमि को बराबर पदों में बाँटना और माप। <b>2. नियम वाला हिस्सा:</b> कौन सा कमरा किस दिशा में हो आदि। दूसरा हिस्सा फलित जैसा है और अलग ग्रंथों तथा परंपराओं में अलग मिलता है। इस अध्याय में सिर्फ पहला हिस्सा है। नियमों वाला हिस्सा बाद में, स्रोत के नाम के साथ आएगा।`,
`Vastu Shastra is the science of buildings, land and directions. Its ancient texts are said to include the Brihat Samhita (which has a chapter on Vastuvidya), Mayamata, Samarangana Sutradhara, Manasara and Vishvakarma Prakasha (verify). The shastra can be split in two: <b>1. The maths-and-geometry part:</b> finding directions, the Sun's direction, shadows (the gnomon), dividing land into equal padas, and measures. <b>2. The rules part:</b> which room should lie in which direction and so on. The second part is like falit and differs between texts and traditions. This chapter covers only the first part. The rules part will come later, with the source named.`),
st("दिशाएँ: 4, 8 और उनके दिक्पाल","Directions: the 4, the 8 and their dikpalas",
`मुख्य दिशाएँ 4 हैं: पूर्व, दक्षिण, पश्चिम, उत्तर। इनके बीच की चार कोण-दिशाएँ जोड़ने पर 8 हो जाती हैं: आग्नेय (पूर्व-दक्षिण), नैऋत्य (दक्षिण-पश्चिम), वायव्य (पश्चिम-उत्तर) और ईशान (उत्तर-पूर्व)। हर दिशा के साथ परंपरा में एक दिक्पाल (दिशा का अधिपति) जुड़ा है। दिशा को अंश (बेयरिंग) में बताया जाता है: उत्तर = 0°, फिर घड़ी की दिशा में, पूर्व = 90°, दक्षिण = 180°, पश्चिम = 270°। 8 दिशाओं में हर एक 45° चौड़ी है, और उसकी मध्य-रेखा दिशा के अंश पर होती है।`+tbl(["दिशा","दिक्पाल","बेयरिंग-सीमा"],[...Array(8)].map((_,k)=>[DIRS[0][k],DIKP[0][k],`${f(((k*45-22.5)+360)%360,1)}° – ${f(k*45+22.5,1)}°`]))+`(उत्तर के दिक्पाल को कुछ ग्रंथों में कुबेर और कुछ में सोम कहा गया है।)`,
`There are 4 main directions: East, South, West, North. Adding the four corner directions between them makes 8: South-East (Agneya), South-West (Nairritya), North-West (Vayavya) and North-East (Ishanya). Tradition joins each direction with a dikpala (guardian of the direction). A direction is given in degrees (bearing): North = 0°, then clockwise, East = 90°, South = 180°, West = 270°. Each of the 8 directions is 45° wide, with its middle line at the direction's degree.`+tbl(["Direction","Dikpala","Bearing range"],[...Array(8)].map((_,k)=>[DIRS[1][k],DIKP[1][k],`${f(((k*45-22.5)+360)%360,1)}° – ${f(k*45+22.5,1)}°`]))+`(The guardian of the north is called Kubera in some texts and Soma in others.)`),
st("कंपास और सच्चा उत्तर","The compass and true north",
`कंपास की सुई <b>चुंबकीय उत्तर</b> दिखाती है, जो <b>सच्चे (भौगोलिक) उत्तर</b> से कुछ अंश अलग हो सकता है। इस अंतर को चुंबकीय विचलन (declination) कहते हैं; यह जगह और साल के साथ बदलता है, और दुनिया के कुछ हिस्सों में 10° से भी ज़्यादा हो सकता है। लोहे, बिजली के तार और फोन के आसपास भी रीडिंग बिगड़ती है। इसलिए ठीक पूर्व-पश्चिम निकालने का भरोसेमंद तरीका सूर्य की छाया (शंकु) है, जैसा अगले चरणों में दिखाया गया है। (प्राचीन ग्रंथों में दिशा-साधन शंकु से ही बताया गया है; सूर्य सिद्धांत के तीसरे अध्याय में इसका गणित है: जाँचें।)`,
`A compass needle shows <b>magnetic north</b>, which can differ by a few degrees from <b>true (geographic) north</b>. This gap is called magnetic declination; it changes with place and year and in some parts of the world can exceed 10°. Iron, electric wires and phones nearby also spoil the reading. So the dependable way to get a true east-west line is the shadow of the Sun (the gnomon), as shown in the next steps. (The old texts give direction-finding by the gnomon; the maths is in the third chapter of the Surya Siddhanta: verify.)`),
st("सूर्य की दिशा: हर दिन पूर्व में नहीं","The Sun's direction: not due east every day",
`सूर्य ठीक पूर्व में सिर्फ विषुव (लगभग 21 मार्च और 23 सितंबर) के आसपास उगता है। बाकी दिन वह पूर्व से उत्तर या दक्षिण की ओर खिसककर उगता है। कारण: सूर्य की क्रांति (declination) δ साल भर +23.44° से −23.44° के बीच बदलती रहती है। उगने की दिशा का सूत्र (क्षितिज पर सूर्य के केंद्र के लिए): <b>sin A = sin δ ÷ cos φ</b>, जहाँ φ जगह का अक्षांश है और A = पूर्व से उत्तर की ओर का कोण। फिर <b>सूर्योदय की दिशा = 90° − A</b> और <b>सूर्यास्त की दिशा = 270° + A</b>। (वायुमंडल से किरण का मुड़ना और सूर्य-बिंब के आकार के कारण असली मान सूत्र से लगभग आधा अंश अलग आता है।) उत्तर-दक्षिण का 23.44° वाला यह अधिकतम मान ही अयन (उत्तरायण-दक्षिणायन) का भौतिक आधार है।`+tbl(["तारीख","सूर्योदय","सूर्यास्त"],vz.key.map((k,i)=>[['वसंत विषुव','ग्रीष्म अयनांत','शरद विषुव','शीत अयनांत'][i],`${f(k.rise,1)}° ${DIRS[0][dirIdx(k.rise)]}`,`${f(k.set,1)}° ${DIRS[0][dirIdx(k.set)]}`])),
`The Sun rises due east only around the equinoxes (about 21 March and 23 September). On other days it rises shifted from east towards north or south. The reason: the Sun's declination δ keeps changing through the year between +23.44° and −23.44°. The formula for the rising direction (for the Sun's centre at the horizon): <b>sin A = sin δ ÷ cos φ</b>, where φ is the latitude and A = the angle from east towards north. Then <b>sunrise direction = 90° − A</b> and <b>sunset direction = 270° + A</b>. (Because of the bending of light by the air and the size of the Sun's disc, the real value differs from the formula by about half a degree.) This 23.44° maximum is the physical basis of the ayana (Uttarayana-Dakshinayana).`+tbl(["Date","Sunrise","Sunset"],vz.key.map((k,i)=>[['Spring equinox','Summer solstice','Autumn equinox','Winter solstice'][i],`${f(k.rise,1)}° ${DIRS[1][dirIdx(k.rise)]}`,`${f(k.set,1)}° ${DIRS[1][dirIdx(k.set)]}`])),
[`${pd}: δ = ${f(vz.decl,2)}°, φ = ${pn.inp.lat}° → A = ${f(Math.asin(Math.sin(vz.decl*Math.PI/180)/Math.cos(pn.inp.lat*Math.PI/180))*180/Math.PI,2)}° → सूत्र से सूर्योदय ${f(90-Math.asin(Math.sin(vz.decl*Math.PI/180)/Math.cos(pn.inp.lat*Math.PI/180))*180/Math.PI,2)}°; एफेमेरिस से ${f(vz.rise.az,2)}°`,`${pd}: δ = ${f(vz.decl,2)}°, φ = ${pn.inp.lat}° → A = ${f(Math.asin(Math.sin(vz.decl*Math.PI/180)/Math.cos(pn.inp.lat*Math.PI/180))*180/Math.PI,2)}° → formula sunrise ${f(90-Math.asin(Math.sin(vz.decl*Math.PI/180)/Math.cos(pn.inp.lat*Math.PI/180))*180/Math.PI,2)}°; ephemeris ${f(vz.rise.az,2)}°`]),
st("शंकु की छाया से पूर्व-पश्चिम","East-west from the shadow of a gnomon",
`<b>शंकु</b> एक सीधी खड़ी छड़ी है। विधि: (1) समतल ज़मीन पर शंकु गाड़ें और उसके पास कंपास-रहित एक वृत्त खींचें। (2) सुबह जब छाया की नोक वृत्त को छुए, वहाँ निशान लगाएँ। (3) दोपहर बाद जब छाया की नोक वृत्त को दोबारा छुए, दूसरा निशान लगाएँ। (4) दोनों निशानों को जोड़ने वाली रेखा <b>पूर्व-पश्चिम</b> है और उसके लंबवत रेखा उत्तर-दक्षिण। कारण: दोनों समय सूर्य की ऊँचाई बराबर है (तभी छाया की लंबाई बराबर), और दोपहर के दोनों ओर सूर्य की दिशा उत्तर-दक्षिण रेखा के आर-पार बराबर कोण पर होती है, इसलिए दोनों छायाएँ उस रेखा के दोनों तरफ सममित हैं। एक दिन में सूर्य की क्रांति थोड़ी बदलती है, इसलिए रेखा कुछ बहुत कम अंश अशुद्ध रह सकती है। छाया की लंबाई = शंकु की ऊँचाई ÷ tan(सूर्य की ऊँचाई)।`,
`A <b>gnomon (shanku)</b> is a straight upright stick. Method: (1) plant the gnomon on level ground and draw a circle around it. (2) In the morning, when the tip of the shadow touches the circle, mark the spot. (3) In the afternoon, when the tip touches the circle again, mark the second spot. (4) The line joining the two marks is <b>east-west</b> and the line at right angles to it is north-south. The reason: the Sun's altitude is the same at both times (that is why the shadow lengths are equal), and on the two sides of noon the Sun's direction makes equal angles across the north-south line, so the two shadows are symmetric about it. In one day the Sun's declination changes slightly, so the line can be off by a very small angle. Shadow length = gnomon height ÷ tan(Sun's altitude).`,
[`${pd}: सुबह ${vz.pair.t1} और दोपहर बाद ${vz.pair.t2}, दोनों पर सूर्य की ऊँचाई ${vz.pair.alt}°। छाया = 1 ÷ tan(${vz.pair.alt}°) = ${f(1/Math.tan(vz.pair.alt*Math.PI/180),3)} शंकु-ऊँचाई। दोनों नोकों को जोड़ने वाली रेखा पूर्व-पश्चिम से ${f(Math.abs(Math.atan2(tipXY(vz.pair.az2,vz.pair.alt)[1]-tipXY(vz.pair.az1,vz.pair.alt)[1],tipXY(vz.pair.az2,vz.pair.alt)[0]-tipXY(vz.pair.az1,vz.pair.alt)[0])*180/Math.PI),3)}° अलग।`,`${pd}: morning ${vz.pair.t1} and afternoon ${vz.pair.t2}, the Sun's altitude ${vz.pair.alt}° at both. Shadow = 1 ÷ tan(${vz.pair.alt}°) = ${f(1/Math.tan(vz.pair.alt*Math.PI/180),3)} gnomon heights. The line through the two tips differs from east-west by ${f(Math.abs(Math.atan2(tipXY(vz.pair.az2,vz.pair.alt)[1]-tipXY(vz.pair.az1,vz.pair.alt)[1],tipXY(vz.pair.az2,vz.pair.alt)[0]-tipXY(vz.pair.az1,vz.pair.alt)[0])*180/Math.PI),3)}°.`]),
st("भूमि को पदों में बाँटना: मंडल की ज्यामिति","Dividing land into padas: the geometry of the mandala",
`वास्तु-पुरुष मंडल में भूखंड को वर्ग मानकर बराबर छोटे वर्गों (पद) में बाँटा जाता है। दो प्रचलित जालियाँ हैं: <b>9 × 9 = 81 पद</b> (परमशायिका) और <b>8 × 8 = 64 पद</b> (मंडूक)। दोनों में बीच का हिस्सा <b>ब्रह्मस्थान</b> कहलाता है (81 में बीच के 3×3 पद, 64 में बीच के 2×2 पद)। ज्यामिति: एक पद की भुजा = भूखंड की भुजा ÷ 9 (या ÷ 8)। चार कोने ईशान, आग्नेय, नैऋत्य और वायव्य हैं (ऊपर उत्तर, दाएँ पूर्व)। भूखंड आयताकार हो तो चौड़ाई और लंबाई अलग-अलग भाग दी जाती हैं। (किस पद में किस देवता का स्थान माना जाता है और उसके नियम बाद में।)`+`<div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1 1 150px">${gridSvg(9)}</div><div style="flex:1 1 150px">${gridSvg(8)}</div></div>`,
`In the Vastu Purusha mandala the plot is taken as a square and divided into equal small squares (padas). Two grids are in common use: <b>9 × 9 = 81 padas</b> (Paramashayika) and <b>8 × 8 = 64 padas</b> (Manduka). In both the central part is called the <b>Brahmasthan</b> (the middle 3×3 padas in the 81 grid, the middle 2×2 in the 64 grid). Geometry: the side of one pada = the side of the plot ÷ 9 (or ÷ 8). The four corners are Ishanya, Agneya, Nairritya and Vayavya (north is up, east is right). For a rectangular plot the width and the length are divided separately. (Which deity's place is taken to lie in which pada, and its rules, come later.)`+`<div style="display:flex;gap:6px;flex-wrap:wrap"><div style="flex:1 1 150px">${gridSvg(9)}</div><div style="flex:1 1 150px">${gridSvg(8)}</div></div>`),
st("अभ्यास, माप की इकाइयाँ और सार","Practice, units of length and recap",
`<b>प्र.1</b> सूर्योदय 65° की दिशा पर दिखा। यह कौन सी दिशा है?<details><summary style="cursor:pointer">उत्तर</summary>65° ∈ [22.5°, 67.5°) इसलिए ${DIRS[0][dirIdx(65)]} (दिक्पाल ${DIKP[0][dirIdx(65)]})।</details><br><b>प्र.2</b> भूखंड 30 फुट × 40 फुट है। 9 × 9 जाली में एक पद कितना बड़ा है?<details><summary style="cursor:pointer">उत्तर</summary>चौड़ाई: 30 ÷ 9 = ${f(30/9,2)} फुट; लंबाई: 40 ÷ 9 = ${f(40/9,2)} फुट। (ब्रह्मस्थान बीच के 3×3 पद: ${f(30/3,1)} × ${f(40/3,1)} फुट।)</details><br><b>प्र.3</b> दिल्ली (28.6°N) में 21 जून को (δ = 23.44°) सूत्र से सूर्योदय की दिशा निकालिए।<details><summary style="cursor:pointer">उत्तर</summary>A = asin(sin 23.44° ÷ cos 28.6°) = ${f(Math.asin(Math.sin(23.44*Math.PI/180)/Math.cos(28.6*Math.PI/180))*180/Math.PI,2)}°। सूर्योदय = 90° − A = ${f(90-Math.asin(Math.sin(23.44*Math.PI/180)/Math.cos(28.6*Math.PI/180))*180/Math.PI,2)}° (उत्तर-पूर्व की ओर)। वास्तविक मान लगभग आधा अंश कम आता है।</details><br><b>माप की इकाइयाँ:</b> पारंपरिक ग्रंथों में माप अंगुल, हस्त (हाथ) जैसी इकाइयों में दी जाती है, जैसे 24 अंगुल = 1 हस्त। इनकी आधुनिक लंबाई ग्रंथ और क्षेत्र के हिसाब से अलग मिलती है (लगभग 1 हस्त ≈ 45 सेमी), इसलिए पुराने माप को आधुनिक माप में बदलते समय स्रोत का नाम ज़रूर देखें। <b>सार:</b> (1) दिशा = बेयरिंग; 8 दिशाएँ 45° की। (2) सूर्य हर दिन ठीक पूर्व में नहीं उगता। (3) शंकु की बराबर लंबाई की दो छायाएँ पूर्व-पश्चिम देती हैं। (4) पद = भूखंड ÷ 9 या ÷ 8। (5) कमरे किस दिशा में हों, ये नियम बाद में।`,
`<b>Q1</b> The Sun was seen rising at the 65° direction. Which direction is that?<details><summary style="cursor:pointer">Answer</summary>65° lies in [22.5°, 67.5°) so ${DIRS[1][dirIdx(65)]} (dikpala ${DIKP[1][dirIdx(65)]}).</details><br><b>Q2</b> A plot is 30 ft × 40 ft. How big is one pada in the 9 × 9 grid?<details><summary style="cursor:pointer">Answer</summary>Width: 30 ÷ 9 = ${f(30/9,2)} ft; length: 40 ÷ 9 = ${f(40/9,2)} ft. (The Brahmasthan, the middle 3×3 padas: ${f(30/3,1)} × ${f(40/3,1)} ft.)</details><br><b>Q3</b> For Delhi (28.6°N) on 21 June (δ = 23.44°) work out the sunrise direction by the formula.<details><summary style="cursor:pointer">Answer</summary>A = asin(sin 23.44° ÷ cos 28.6°) = ${f(Math.asin(Math.sin(23.44*Math.PI/180)/Math.cos(28.6*Math.PI/180))*180/Math.PI,2)}°. Sunrise = 90° − A = ${f(90-Math.asin(Math.sin(23.44*Math.PI/180)/Math.cos(28.6*Math.PI/180))*180/Math.PI,2)}° (towards north-east). The real value comes out about half a degree less.</details><br><b>Units of length:</b> traditional texts give measures in units such as the angula and the hasta (cubit), for example 24 angulas = 1 hasta. Their modern lengths differ by text and region (roughly 1 hasta ≈ 45 cm), so when converting an old measure to a modern one always note the source. <b>Recap:</b> (1) a direction = a bearing; the 8 directions are 45° each. (2) The Sun does not rise due east every day. (3) Two shadows of equal length of a gnomon give the east-west line. (4) Pada = plot ÷ 9 or ÷ 8. (5) Which rooms go in which direction comes later.`)]},
{t:["कुंडली मिलान का गणित","Kundali Milan maths"],s:[
st("मिलान क्या है और क्या चाहिए","What is Milan and what does it need",
`अष्टकूट मिलान दो लोगों के <b>चंद्र की राशि और नक्षत्र</b> से बनता है, बाकी कुंडली से नहीं। आठ कूट हैं और उनके अधिकतम अंक 1, 2, 3, 4, 5, 6, 7, 8 हैं, जिनका जोड़ 36 है। परंपरा में एक को वर और दूसरे को वधू मानकर गिनती की जाती है, क्योंकि कई कूट दिशा पर निर्भर हैं।`+tbl(["कूट","अंक","किससे निकलता है"],[["वर्ण","1","चंद्र राशि"],["वश्य","2","चंद्र राशि"],["तारा","3","चंद्र नक्षत्र (गिनती, 9 का शेष)"],["योनि","4","चंद्र नक्षत्र"],["ग्रह मैत्री","5","चंद्र राशि का स्वामी"],["गण","6","चंद्र नक्षत्र"],["भकूट","7","दोनों चंद्र राशियों की दूरी"],["नाड़ी","8","चंद्र नक्षत्र"]]),
`Ashtakoot matching is built only from the <b>Moon's rashi and nakshatra</b> of the two people, not from the rest of the kundali. There are eight koots with maximum points 1, 2, 3, 4, 5, 6, 7, 8, which add up to 36. By tradition one person is taken as the groom and the other as the bride, because several koots depend on direction.`+tbl(["Koot","Points","Comes from"],[["Varna","1","Moon rashi"],["Vashya","2","Moon rashi"],["Tara","3","Moon nakshatra (count, remainder of 9)"],["Yoni","4","Moon nakshatra"],["Graha maitri","5","Lord of the Moon rashi"],["Gana","6","Moon nakshatra"],["Bhakoot","7","Distance between the two Moon rashis"],["Nadi","8","Moon nakshatra"]])),
st("नक्षत्र से गण, नाड़ी और योनि","Gana, nadi and yoni from the nakshatra",
`हर नक्षत्र को एक गण (देव, मनुष्य, राक्षस), एक नाड़ी (आदि, मध्य, अंत्य) और एक योनि (पशु-प्रतीक) दी गई है। नाड़ी का क्रम एक ज़िगज़ैग है: पहले 9 नक्षत्रों में आदि, मध्य, अंत्य, अंत्य, मध्य, आदि, आदि, मध्य, अंत्य; बीच के 9 में यही उलटा; अंतिम 9 में फिर पहले जैसा। नीचे पूरी तालिका है (योनि वाला कॉलम कुछ स्रोतों से मेल खाता है, कुछ मेरी याद पर है: जाँचें)।`+`<details><summary style="cursor:pointer">27</summary>${tbl(["#","नक्षत्र","गण","नाड़ी","योनि"],[...Array(27)].map((_,n)=>[n+1,NK[0][n],GANN[0][GANA[n]],NADN[0][nadiIdx(n)],YON[0][YMAP[n]]]))}</details>`,
`Every nakshatra is given a gana (Deva, Manushya, Rakshasa), a nadi (Adi, Madhya, Antya) and a yoni (an animal symbol). The nadi order is a zigzag: in the first 9 nakshatras Adi, Madhya, Antya, Antya, Madhya, Adi, Adi, Madhya, Antya; in the middle 9 the same reversed; in the last 9 as at first. The full table is below (the yoni column matches some sources and partly rests on my memory: verify).`+`<details><summary style="cursor:pointer">27</summary>${tbl(["#","Nakshatra","Gana","Nadi","Yoni"],[...Array(27)].map((_,n)=>[n+1,NK[1][n],GANN[1][GANA[n]],NADN[1][nadiIdx(n)],YON[1][YMAP[n]]]))}</details>`),
st("पाँच कूटों की गिनती","Counting the five koots",
`<b>वर्ण (1):</b> राशि से वर्ण: मीन, कर्क, वृश्चिक = ब्राह्मण; मेष, सिंह, धनु = क्षत्रिय; वृषभ, कन्या, मकर = वैश्य; मिथुन, तुला, कुंभ = शूद्र। वर का वर्ण वधू के बराबर या ऊँचा हो तो 1, नहीं तो 0।<br><b>तारा (3):</b> वधू के नक्षत्र से वर के नक्षत्र तक गिनें (शुरू वाला भी गिना जाता है), 9 से भाग देकर शेष देखें (0 हो तो 9)। शेष 3, 5, 7 अशुभ गिने जाते हैं। फिर वर से वधू की ओर भी यही। दोनों ठीक तो 3, एक ठीक तो 1.5, दोनों नहीं तो 0।<br><b>ग्रह मैत्री (5):</b> दोनों राशियों के स्वामी ग्रह देखें और हर एक की दूसरे के प्रति नैसर्गिक मित्रता (मित्र/सम/शत्रु)। स्वामी एक ही या दोनों मित्र: 5; मित्र+सम: 4; सम+सम: 3; मित्र+शत्रु: 1; सम+शत्रु: 0.5; शत्रु+शत्रु: 0।<br><b>भकूट (7):</b> वधू की राशि से वर की राशि तक गिनें। दूरी 2/12, 5/9 या 6/8 हो तो 0, वरना 7।<br><b>नाड़ी (8):</b> दोनों की नाड़ी अलग हो तो 8, एक ही हो तो 0।`,
`<b>Varna (1):</b> rashi to varna: Meen, Kark, Vrishchik = Brahmin; Mesh, Singh, Dhanu = Kshatriya; Vrishabh, Kanya, Makar = Vaishya; Mithun, Tula, Kumbh = Shudra. If the groom's varna is equal to or higher than the bride's, 1; else 0.<br><b>Tara (3):</b> count from the bride's nakshatra to the groom's (the starting one is counted too), divide by 9 and take the remainder (9 if 0). Remainders 3, 5, 7 are counted as unfavourable. Then do the same from groom to bride. Both fine: 3; one fine: 1.5; neither: 0.<br><b>Graha maitri (5):</b> take the lords of the two rashis and each one's natural friendship (friend/neutral/enemy) toward the other. Same lord or both friends: 5; friend+neutral: 4; neutral+neutral: 3; friend+enemy: 1; neutral+enemy: 0.5; enemy+enemy: 0.<br><b>Bhakoot (7):</b> count from the bride's rashi to the groom's. If the distance is 2/12, 5/9 or 6/8: 0, else 7.<br><b>Nadi (8):</b> different nadis: 8; the same nadi: 0.`,
[`उदाहरण (आपका चंद्र = वर, चुने हुए दिन का चंद्र = वधू मानकर): वर्ण ${VARN[0][mc.varna.g]}/${VARN[0][mc.varna.b]} → ${mc.varna.s}; तारा ${mc.tara.x.c}(शेष ${mc.tara.x.r}) और ${mc.tara.y.c}(शेष ${mc.tara.y.r}) → ${mc.tara.s}; ग्रह मैत्री ${GN[0][mc.mait.la]}/${GN[0][mc.mait.lb]} → ${mc.mait.s}; भकूट दूरी ${mc.bhak.d} → ${mc.bhak.s}; नाड़ी ${NADN[0][mc.nadi.g]}/${NADN[0][mc.nadi.b]} → ${mc.nadi.s}; जोड़ ${mc.total}/24`,`Example (your Moon = groom, the Moon of the chosen day = bride): varna ${VARN[1][mc.varna.g]}/${VARN[1][mc.varna.b]} → ${mc.varna.s}; tara ${mc.tara.x.c}(rem. ${mc.tara.x.r}) and ${mc.tara.y.c}(rem. ${mc.tara.y.r}) → ${mc.tara.s}; graha maitri ${GN[1][mc.mait.la]}/${GN[1][mc.mait.lb]} → ${mc.mait.s}; bhakoot distance ${mc.bhak.d} → ${mc.bhak.s}; nadi ${NADN[1][mc.nadi.g]}/${NADN[1][mc.nadi.b]} → ${mc.nadi.s}; total ${mc.total}/24`]),
st("तालिकाओं में फर्क: हम सावधान क्यों हैं","Differences between tables: why we are careful",
`आपने शुरू में कहा था कि नियम कभी एक-दूसरे का साथ देते हैं और कभी टकराते हैं। मिलान में यह साफ दिखता है। मैंने अलग-अलग स्रोत देखे तो: <b>वश्य</b> की अंक-तालिकाएँ अलग-अलग मिलीं (कहीं चार वर्ग, कहीं पाँच, और अंक भी अलग); <b>योनि</b> में एक स्रोत 14×14 मित्र-शत्रु तालिका देता है और दूसरा सिर्फ 'एक ही योनि, नर-मादा का भेद और सात शत्रु जोड़ियाँ' पर चलता है; <b>गण</b> की असमान जोड़ियों के अंक स्रोत पर निर्भर हैं; और <b>तारा</b> में कुछ स्रोत जन्म-तारा को अंक देते हैं, कुछ नहीं। सात शत्रु योनि-जोड़ियाँ प्रायः ये मानी जाती हैं: गाय-बाघ, हाथी-सिंह, घोड़ा-भैंस, कुत्ता-हिरण, सर्प-नेवला, बंदर-भेड़, बिल्ली-चूहा। इसलिए ऐप सिर्फ वही पाँच कूट अंकित करता है जिनके नियम सुसंगत मिले (कुल 24 अंक); बाकी की श्रेणी दिखाता है, अंक नहीं। अगर आप किसी खास ग्रंथ या गुरु की तालिका को आधार बनाना चाहें तो वह भेज दें, तब उसी के अनुसार ऐप में जोड़ा जा सकता है। मिलान एक परंपरागत अंक-प्रणाली है; इससे जीवन के बड़े फैसले अकेले नहीं किए जाने चाहिए।`,
`You said at the start that rules sometimes support and sometimes contradict one another. Milan shows this clearly. In the sources I looked at: the scoring tables for <b>Vashya</b> differ (four groups in some, five in others, and different points); for <b>Yoni</b> one source gives a 14×14 friend-enemy table and another works only on 'same yoni, male-female difference and seven enemy pairs'; the points for unequal <b>Gana</b> pairs depend on the source; and for <b>Tara</b> some sources give points for the birth star and some do not. The seven enemy yoni pairs are usually taken as: cow-tiger, elephant-lion, horse-buffalo, dog-deer, serpent-mongoose, monkey-sheep, cat-rat. So the app scores only the five koots whose rules were consistent (24 points in all); for the rest it shows the category, not a score. If you want to base it on a particular text or a teacher's table, send it and it can be added accordingly. Milan is a traditional point system; big life decisions should not be made on it alone.`)]},

{t:["ग्रंथ और आगे की पढ़ाई","Books and further study"],s:[
st("शास्त्र कैसे पढ़ें: सुझाव","How to study the shastra: suggestions",
`इस ऐप में आपने गणित सीखा। मूल शास्त्र पढ़ने के लिए ये आधार काम आते हैं: (1) देवनागरी और संस्कृत की प्रारंभिक समझ, (2) गणित वाले भाग का अभ्यास (जो आप कर चुके हैं), (3) एक अनुभवी गुरु या विद्यालय का मार्गदर्शन। मूल ग्रंथों में श्लोक छोटे और संकेतात्मक होते हैं; टीका (टिप्पणी) के बिना अर्थ में चूक हो सकती है, इसलिए हमेशा किसी मान्य टीका के साथ पढ़ें। यह भी ध्यान रखें कि एक ही ग्रंथ के अलग संस्करणों में पाठ भेद होते हैं।`,
`In this app you learnt the maths. To read the original shastra these foundations help: (1) a basic grasp of Devanagari and Sanskrit, (2) practice with the maths part (which you have done), (3) the guidance of an experienced teacher or school. Verses in the original texts are short and cryptic; without a commentary the meaning can go wrong, so always read with a recognised commentary. Also remember that different editions of the same text have variant readings.`),
st("ग्रंथों की सूची","List of texts",
`नीचे की सूची में जिन बातों के आगे (जाँचें) लिखा है, वे मेरी याद पर आधारित हैं, इसलिए खरीदने या पढ़ने से पहले प्रकाशक/संस्करण खुद पक्का कर लें।`+tbl(["ग्रंथ","क्या है","कहाँ/कैसे"],BK.map(x=>[x[0],x[1],x[3]])),
`Items marked (verify) in the list below are from my memory, so please confirm the publisher/edition yourself before buying or reading.`+tbl(["Text","What it is","Where/how"],BK.map(x=>[x[0],x[2],x[4]]))),
st("पढ़ाई कहाँ करें","Where to study",
`वाराणसी के संपूर्णानंद संस्कृत विश्वविद्यालय (पहले गवर्नमेंट संस्कृत कॉलेज, बनारस) में ज्योतिष की परंपरागत पढ़ाई होती है। मेरी जानकारी के अनुसार काशी हिंदू विश्वविद्यालय (BHU) और हरिद्वार के उत्तराखंड संस्कृत विश्वविद्यालय में भी ज्योतिष के पाठ्यक्रम हैं (जाँचें)। पाठ्यक्रम, योग्यता और प्रवेश की जानकारी उनकी आधिकारिक वेबसाइट से लें। इसके अलावा गुरु-शिष्य परंपरा में किसी विद्वान से सीखना भी रास्ता है। मैं किताबें खुद भेज नहीं सकता (कॉपीराइट), पर ऊपर की सूची में जो स्रोत सार्वजनिक या कानूनी रूप से उपलब्ध हैं, उनके नाम दिए हैं।`,
`The Sampurnanand Sanskrit University in Varanasi (formerly the Government Sanskrit College, Banaras) offers traditional Jyotish study. As far as I know Banaras Hindu University (BHU) and Uttarakhand Sanskrit University in Haridwar also have Jyotish courses (verify). Take the syllabus, eligibility and admission details from their official websites. Learning from a scholar in the guru-shishya tradition is another route. I cannot send books myself (copyright), but the list above names the sources that are publicly or legally available.`)]}];

const tabs=`<div style="display:flex;gap:6px;margin-bottom:12px"><button data-lt="g" class="${lt=='g'?'p':''}" style="flex:1">${t('tg')}</button><button data-lt="f" class="${lt=='f'?'p':''}" style="flex:1">${t('tf')}</button></div>`;
if(lt=='f'){$('learn').innerHTML=tabs+`<div class="card">${t('fl')}</div>`;bindTabs();return}
const chips=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${CH.map((c,k)=>`<button data-lc="${k}" class="${k==lc?'p':''}">${k}. ${c.t[I]}</button>`).join('')}</div>`;
const cur=CH[lc],sm=SIMP[lc],I2=L();
const stepsHtml=cur.s.map((s,k)=>`<div class="step"><h3>${lc}.${k+1} ${s[0][I]}</h3>${s[1][I]}${s[3]?`<div style="max-width:420px;margin:8px auto">${s[3]}</div>`:''}${s[2]?`<div class="ex">${s[2][I]}</div>`:''}</div>`).join('');
const nav=`<div style="display:flex;gap:8px"><button ${lc==0?'disabled':''} data-lc="${lc-1}" style="flex:1">◀</button><button ${lc==CH.length-1?'disabled':''} data-lc="${lc+1}" style="flex:1">▶</button></div>`;
const tog=`<div style="display:flex;gap:6px;margin-bottom:10px"><button data-lv="simple" class="${LV=='simple'?'p':''}" style="flex:1">${T2('सरल (विद्यार्थी)','Simple (student)')}</button><button data-lv="detail" class="${LV=='detail'?'p':''}" style="flex:1">${T2('विस्तृत','Detailed')}</button><button class="noprint" onclick="window.print()" title="Print">🖨</button></div>`;
const teach=lc==0?`<div class="card"><b>${T2('शिक्षक के लिए सुझाव','Tips for teachers')}</b><ol style="padding-left:18px;margin:6px 0"><li>${T2('गणित वाला हिस्सा आसमान को देखकर जाँचा जा सकता है: उसे प्रेक्षण (चाँद की डायरी, छाया-प्रयोग) से जोड़ें।','The ganit part can be checked by looking at the sky: tie it to observation (a Moon diary, the shadow experiment).')}</li><li>${T2("फलित को 'परंपरा के अनुसार' कहकर पढ़ाएँ। यह विश्वास पर आधारित है; वैज्ञानिक परीक्षणों में फलित की भविष्यवाणियों की सटीकता सिद्ध नहीं हुई है।","Teach falit as 'according to tradition'. It rests on belief; scientific tests have not shown predictions from falit to be accurate.")}</li><li>${T2('बच्चों को डराने वाली बातें न कहें और किसी बच्चे का भविष्य न बताएँ।','Do not say frightening things to children and do not predict any child\'s future.')}</li><li>${T2('कक्षा के अभ्यास में असली बच्चों या परिवारों की जन्म-जानकारी की जगह काल्पनिक तारीखें लें।','In class exercises use imaginary dates instead of real children\'s or families\' birth details.')}</li><li>${T2('हर बात का स्रोत बताने की आदत डालें।','Make a habit of naming the source of every statement.')}</li></ol></div>`:'';
const simp=sm?`<div class="card"><b>${T2('सरल भाषा में','In simple words')}</b><ul style="padding-left:18px;margin:8px 0">${sm.p.map(x=>`<li style="margin:6px 0">${x[I2]}</li>`).join('')}</ul></div><div class="card"><b>${T2('करके देखें','Try it yourself')}</b><p>${sm.a[I2]}</p></div>${quizHtml(sm.q)}`:'';
const head=tabs+tog+chips+`<p class="mut">${note}</p>`;
$('learn').innerHTML=LV=='simple'?head+teach+simp+`<details class="card"><summary style="cursor:pointer"><b>${T2('विस्तार से पढ़ें','Read in detail')}</b></summary>${stepsHtml}</details>`+nav:head+stepsHtml+(sm?`<div class="card"><b>${T2('करके देखें','Try it yourself')}</b><p>${sm.a[I2]}</p></div>${quizHtml(sm.q)}`:'')+nav;
bindTabs()}
function bindTabs(){document.querySelectorAll('[data-lt]').forEach(b=>b.onclick=()=>{lt=b.dataset.lt;showLearn()});document.querySelectorAll('[data-lc]').forEach(b=>b.onclick=()=>{lc=+b.dataset.lc;showLearn();window.scrollTo(0,0)});document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{LV=localStorage.lv=b.dataset.lv;showLearn()})}
if('serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('/sw.js').catch(()=>{});
applyLang();
</script></body></html>
